<style>
/* Layout concept: a study notebook. One column, big kana and kanji as the main visual,
   bottom tab bar with one kanji per tab. Indigo ink on cool paper. */
:root{
  --paper:#F1F3F9; --panel:#FFFFFF; --ink:#1A2246; --ink2:#4B557D; --line:#D6DBEA;
  --accent:#2A3A8F; --accent-ink:#FFFFFF; --soft:#E4E8F7; --gold:#9A6B0C;
  --ok:#1D7A4B; --ok-bg:#E2F4EA; --bad:#B0352E; --bad-bg:#FBE7E5;
  --display:"Shippori Mincho B1","Shippori Mincho","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0D1230; --panel:#161D44; --ink:#E9ECFA; --ink2:#A4ACD3; --line:#2A3366;
  --accent:#93A3FF; --accent-ink:#0D1230; --soft:#1F2857; --gold:#E3B24C;
  --ok:#62D096; --ok-bg:#133B2B; --bad:#FF8F86; --bad-bg:#4A1E22; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0D1230; --panel:#161D44; --ink:#E9ECFA; --ink2:#A4ACD3; --line:#2A3366;
  --accent:#93A3FF; --accent-ink:#0D1230; --soft:#1F2857; --gold:#E3B24C;
  --ok:#62D096; --ok-bg:#133B2B; --bad:#FF8F86; --bad-bg:#4A1E22; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;
  padding-block:20px 104px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3,p{margin:0}
h2{font-family:var(--display);font-size:1.5rem;line-height:1.25;text-wrap:balance}
h3{font-size:1.02rem;line-height:1.35;text-wrap:balance}
.jp{font-family:var(--display)}
.eyebrow{font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);font-weight:700}
.muted{color:var(--ink2)}
.small{font-size:.88rem}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.hero{display:flex;flex-direction:column;gap:6px;padding-top:6px}
.hero h1{font-family:var(--display);font-weight:700;font-size:clamp(64px,24vw,124px);line-height:1;color:var(--accent);letter-spacing:.02em}
.hero .lede{max-width:46ch;color:var(--ink2)}

.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;min-width:0}
.stat b{display:block;font-family:var(--display);font-size:1.7rem;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:.78rem;color:var(--ink2)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 18px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-weight:700}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.block{width:100%}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.bars{display:flex;flex-direction:column;gap:12px}
.bar-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;font-size:.9rem}
.bar-row .track{grid-column:1/-1;height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar-row .fill{height:100%;background:var(--accent);border-radius:99px}
.bar-row b{font-variant-numeric:tabular-nums}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.chip{flex:0 0 auto;min-height:38px;padding:6px 14px;border-radius:99px;border:1px solid var(--line);background:var(--panel);font-size:.92rem;font-weight:500}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}

.kgrid{display:grid;gap:8px}
.kgrid.c5{grid-template-columns:repeat(5,minmax(0,1fr))}
.kgrid.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kcell{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:68px;padding:6px 2px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.kcell .k{font-family:var(--display);font-size:1.7rem;line-height:1.1}
.kcell .r{font-size:.74rem;color:var(--ink2)}
.kcell.empty{border-style:dashed;background:transparent;visibility:hidden}

.note{background:var(--soft);border-radius:10px;padding:12px 14px;font-size:.92rem}
.note b{color:var(--gold)}

.vlist{display:flex;flex-direction:column}
.vitem{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.vitem:last-child{border-bottom:0}
.vitem .w{font-family:var(--display);font-size:1.25rem}
.vitem .rd{font-size:.82rem;color:var(--ink2);margin-left:8px;font-family:var(--body)}
.vitem .m{grid-column:1;font-size:.92rem;color:var(--ink2)}
.vitem .sp{grid-row:1/3;grid-column:2;font-size:.8rem;color:var(--accent);font-weight:700}

details.g{border:1px solid var(--line);border-radius:12px;background:var(--panel)}
details.g summary{list-style:none;cursor:pointer;padding:14px 16px;font-weight:700;display:flex;justify-content:space-between;gap:10px;align-items:center}
details.g summary::-webkit-details-marker{display:none}
details.g summary::after{content:"+";font-size:1.3rem;color:var(--accent)}
details.g[open] summary::after{content:"−"}
details.g .gb{padding:0 16px 16px;display:flex;flex-direction:column;gap:10px}
.ex{border-left:3px solid var(--accent);padding:2px 0 2px 12px}
.ex .j{font-family:var(--display);font-size:1.1rem}
.ex .t{font-size:.88rem;color:var(--ink2)}

.phr{display:grid;grid-template-columns:minmax(0,1fr);gap:0}
.phr button{display:flex;flex-direction:column;align-items:flex-start;gap:0;text-align:left;padding:10px 0;border:0;border-bottom:1px solid var(--line);background:none;width:100%}
.phr button:last-child{border-bottom:0}
.phr .j{font-family:var(--display);font-size:1.15rem}
.phr .t{font-size:.88rem;color:var(--ink2)}
.dlg{display:flex;flex-direction:column;gap:10px}
.line{display:grid;grid-template-columns:4.6rem minmax(0,1fr);gap:8px}
.line .who{font-size:.78rem;color:var(--gold);font-weight:700;padding-top:4px}
.line .j{font-family:var(--display)}
.line .t{font-size:.86rem;color:var(--ink2)}

.kanji-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.kj{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kj .big{font-family:var(--display);font-size:2.6rem;line-height:1.1;color:var(--accent)}
.kj .rd{font-size:.82rem;overflow-wrap:anywhere}
.kj .mn{font-size:.88rem;color:var(--ink2)}

.fc{min-height:240px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;padding:24px 16px;background:var(--panel);border:1px solid var(--line);border-radius:14px;width:100%}
.fc .big{font-family:var(--display);font-size:clamp(2.2rem,11vw,3.4rem);line-height:1.15;overflow-wrap:anywhere}
.fc .rd{font-size:1.1rem;color:var(--accent);font-weight:700}
.fc .mn{font-size:1.1rem}
.fc .hint{font-size:.8rem;color:var(--ink2)}

.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.88rem}
.prog{height:6px;background:var(--soft);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent)}
.tag{display:inline-block;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--gold)}
.qtext{font-size:1.12rem;line-height:1.5}
.doc{white-space:pre-line;font-family:var(--display);font-size:1.12rem;line-height:1.7;border:1px solid var(--line);border-radius:10px;padding:14px 16px;background:var(--soft)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:grid;grid-template-columns:2rem minmax(0,1fr);gap:10px;align-items:center;text-align:left;width:100%;min-height:52px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel)}
.opt .l{display:grid;place-items:center;width:2rem;height:2rem;border-radius:50%;background:var(--soft);font-weight:700;font-size:.85rem}
.opt .tx{overflow-wrap:anywhere}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt.dim{opacity:.6}
.fb{border-radius:10px;padding:12px 14px;font-size:.95rem}
.fb.ok{background:var(--ok-bg)}
.fb.bad{background:var(--bad-bg)}
.fb b.o{color:var(--ok)}.fb b.b{color:var(--bad)}
.score{font-family:var(--display);font-size:4rem;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.rev{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:2px}

.menu{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.mi{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;text-align:left;padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:var(--panel);width:100%}
.mi .a{font-weight:700}.mi .b{font-size:.86rem;color:var(--ink2)}
.mi .go{grid-row:1/3;grid-column:2;color:var(--accent);font-weight:700}
.mi.main{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.mi.main .b,.mi.main .go{color:var(--accent-ink);opacity:.9}

table.t{width:100%;border-collapse:collapse;font-size:.92rem}
table.t th,table.t td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.tw{overflow-x:auto}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--panel);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,minmax(0,1fr));
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:0;padding:4px 2px;text-decoration:none;color:var(--ink2);border-radius:8px;min-height:50px;justify-content:center}
nav.tabs a .kj2{font-family:var(--display);font-size:1.35rem;line-height:1.1}
nav.tabs a .lb{font-size:.7rem;font-weight:700}
nav.tabs a[aria-current="page"]{color:var(--accent)}
nav.tabs a[aria-current="page"] .kj2{border-bottom:3px solid var(--accent)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:99px;font-size:.88rem;z-index:30;max-width:90vw}
/* Semua teks Jepang memakai satu jenis huruf (gothic) agar sama dengan soal */
.kcell .k,.vitem .w,.ex .j,.phr .j,.line .j,.kj .big,.fc .big,.doc,.jp,nav.tabs a .kj2{font-family:var(--body);font-weight:500}
.kj .big{font-weight:700}
@media (prefers-reduced-motion:no-preference){.fill,.prog i{transition:width .4s ease}}
nav.tabs{grid-template-columns:repeat(7,minmax(0,1fr))}nav.tabs a .lb{font-size:.62rem}#sfab{position:fixed;right:16px;bottom:calc(78px + env(safe-area-inset-bottom,0px));width:52px;height:52px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);font:700 1.5rem var(--display);box-shadow:0 4px 14px rgba(0,0,0,.3);z-index:30;cursor:pointer}
#ssheet{position:fixed;left:0;right:0;bottom:0;height:72vh;max-height:620px;background:var(--panel);border-top:1px solid var(--line);border-radius:16px 16px 0 0;box-shadow:0 -8px 24px rgba(0,0,0,.3);z-index:40;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
#ssheet[hidden]{display:none}
.sh-h{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
.sh-b{flex:1;overflow:auto;padding:12px 14px;display:grid;gap:8px;align-content:start}
.sh-f{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}
.sh-f .ta{flex:1}
.bub{padding:10px 14px;border-radius:12px;white-space:pre-wrap;background:var(--panel);border:1px solid var(--line)}.bub.user{background:var(--soft)}.ta{width:100%;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
@media (min-width:560px){.menu{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>

function load(){try{var r=localStorage.getItem(KEY);if(r){var p=JSON.parse(r),b=blank();for(var k in b)if(p[k]!==undefined)b[k]=p[k];return b}}catch(e){}return blank()}

function dkey(d){d=d||new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function streak(){var n=0,d=new Date();if(!P.days[dkey(d)])d.setDate(d.getDate()-1);while(P.days[dkey(d)]){n++;d.setDate(d.getDate()-1)}return n}

/* ---------- Util ---------- */
function $(s,r){return(r||document).querySelector(s)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(arr,r){var a=arr.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(r()*(i+1));var x=a[i];a[i]=a[j];a[j]=x}return a}
var toastT;
function toast(m){var t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){t.hidden=true},2400)}
function jaVoices(){try{return speechSynthesis.getVoices().filter(function(v){return v.lang&&v.lang.toLowerCase().replace("_","-").indexOf("ja")===0})}catch(e){return[]}}
function voiceScore(v){var n=v.name||"",s=0;if(/neural|natural|enhanced|premium|online/i.test(n))s+=5;if(/google/i.test(n))s+=3;if(/kyoko|otoya|haruka|nanami|keita|sayaka|ayumi|ichiro/i.test(n))s+=2;if(!v.localService)s+=1;return s}
function pickVoice(pre){try{var vs=speechSynthesis.getVoices().filter(function(v){return v.lang&&v.lang.toLowerCase().replace("_","-").indexOf(pre)===0});if(!vs.length)return null;
  if(pre==="ja"){var sv="";try{sv=localStorage.getItem("jft_voice_ja")||""}catch(e){}var m=vs.filter(function(v){return v.name===sv})[0];if(m)return m}
  vs.sort(function(a,b){return voiceScore(b)-voiceScore(a)});return vs[0]}catch(e){return null}}
function jaVoice(){return pickVoice("ja")}
function voicePanel(){
  var vs=jaVoices(),sv="";try{sv=localStorage.getItem("jft_voice_ja")||""}catch(e){}var best=pickVoice("ja");
  return '<section class="panel"><h3>🔊 Suara Jepang</h3>'+(vs.length?
    '<select id="vsel" class="ta">'+vs.map(function(v){return '<option value="'+esc(v.name)+'"'+((sv?v.name===sv:best&&v.name===best.name)?' selected':'')+'>'+esc(v.name)+' ('+esc(v.lang)+')</option>'}).join("")+'</select><button class="btn" data-act="vtest">Coba suara</button><p class="muted small">Pilih suara yang paling enak didengar. Kalau semuanya terdengar robotik, pasang suara yang lebih bagus: Pengaturan HP, cari "teks ke ucapan", pilih Layanan Suara dari Google, lalu pasang data suara bahasa Jepang. Nama menunya bisa berbeda di tiap HP.</p>':
    '<p class="muted small">Belum ada suara Jepang di perangkat ini. Pasang lewat Pengaturan HP, cari "teks ke ucapan", pilih Layanan Suara dari Google, lalu pasang data suara bahasa Jepang. Setelah itu buka ulang aplikasi.</p>')+'</section>';
}

function jpText(s){var m=String(s||"").match(/[\u3040-\u30ff\u3400-\u9fff][\u3040-\u30ff\u3400-\u9fff、。！？ー（）()\s]*/g);return m?m.join("。 ").replace(/\(\s*\)/g,"").trim():""}
function speak(text,slow){
  try{
    if(!("speechSynthesis" in window)){toast("Browser ini tidak mendukung suara");return}
    var u=new SpeechSynthesisUtterance(text);u.lang="ja-JP";u.rate=(slow||S.slow)?.6:.9;
    var v=jaVoice();
    if(v)u.voice=v;else toast("Suara Jepang belum terpasang. Lihat petunjuk di Beranda.");
    speechSynthesis.cancel();speechSynthesis.speak(u);
  }catch(e){toast("Suara tidak tersedia di perangkat ini")}
}

function idsOf(t){var a=[];QB.forEach(function(q,i){if(q.t===t)a.push(i)});return a}
function build(ids,r){return ids.map(function(id){var q=QB[id];return{id:id,q:q,opts:shuffle(q.o.map(function(t,i){return{t:t,ok:i===0}}),r)}})}
function startQuiz(mode,arg){
  if(!isPrem()&&(mode==="sim"||(mode==="type"&&(arg==="c"||arg==="d"||arg==="n3"||arg==="n2")))){toast("Fitur Premium");go("akun");return}
  var ids=[],label="",r=Math.random;
  if(mode==="daily"){
    r=rng(Number(dkey().replace(/-/g,"")));label="Soal harian";
    var cnt={m:3,k:3,c:2,d:2};
    ["m","k","c","d"].forEach(function(t){ids=ids.concat(shuffle(idsOf(t),r).slice(0,cnt[t]))});
  }else if(mode==="type"){label="Latihan "+TYPES[arg].n;ids=shuffle(idsOf(arg),r).slice(0,10)}
  else if(mode==="sim"){label="Simulasi mini";["m","k","c","d"].forEach(function(t){ids=ids.concat(shuffle(idsOf(t),r).slice(0,5))})}
  else if(mode==="redo"){label="Ulang soal yang salah";ids=P.wrong.filter(function(i){return QB[i]}).slice(0,20)}
  if(!ids.length){toast("Belum ada soal untuk dikerjakan");return}
  S.Q={mode:mode,label:label,items:build(ids,r),i:0,picks:[],reveal:{},saved:false};
  go("soal");
}

function vQuiz(){
  var Q=S.Q;
  if(Q.i>=Q.items.length)return vResult();
  var it=Q.items[Q.i],q=it.q,pick=Q.picks[Q.i],ans=pick!==undefined;
  var L="ABCD";
  var ctx="";
  if(q.ctx)ctx='<div class="doc" lang="ja">'+esc(q.ctx)+'</div>';
  if(q.say){
    var shown=ans||Q.reveal[Q.i];
    ctx='<div class="row"><button class="btn primary" data-act="play">▶ Putar audio</button><button class="btn" data-act="playslow">▶ Pelan</button>'+(shown?'':'<button class="btn" data-act="reveal">Tampilkan teks</button>')+'</div>'+(shown?'<div class="doc" lang="ja">'+esc(q.say)+'</div>':'');
  }
  var opts=it.opts.map(function(o,i){
    var cls="";
    if(ans){if(o.ok)cls=" ok";else if(i===pick)cls=" bad";else cls=" dim"}
    return '<button class="opt'+cls+'" data-act="pick" data-v="'+i+'" '+(ans?'disabled':'')+'><span class="l">'+L[i]+'</span><span class="tx">'+esc(o.t)+'</span></button>';
  }).join("");
  var correct=it.opts.filter(function(o){return o.ok})[0].t;
  var fb="";
  if(ans){var good=it.opts[pick].ok;fb='<div class="fb '+(good?'ok':'bad')+'"><b class="'+(good?'o':'b')+'">'+(good?'Benar.':'Kurang tepat.')+'</b> '+(good?'':'Jawaban: '+esc(correct)+'. ')+esc(q.e)+'</div>'}
  var sp="";

  var last=Q.i===Q.items.length-1;
  return '<div class="qhead"><span class="tag">'+TYPES[q.t].n+'</span><span class="muted">'+Q.label+' · '+(Q.i+1)+'/'+Q.items.length+'</span></div>'+
   '<div class="prog"><i style="width:'+(Q.i*100/Q.items.length)+'%"></i></div>'+
   '<p class="qtext" style="white-space:pre-line">'+esc(q.q)+'</p>'+ctx+sp+'<div class="opts">'+opts+'</div>'+fb+
   '<div class="row"><button class="btn ghost" data-act="quit">Keluar</button>'+(ans?'<button class="btn primary" data-act="next" style="flex:1">'+(last?'Lihat hasil':'Soal berikutnya')+'</button>':'')+'</div>';
}
function finishQuiz(){
  var Q=S.Q;if(Q.saved)return;Q.saved=true;
  var c=0;
  Q.items.forEach(function(it,i){
    var ok=it.opts[Q.picks[i]]&&it.opts[Q.picks[i]].ok,t=it.q.t;
    var s=P.stats[t]||(P.stats[t]={c:0,t:0});s.t++;if(ok){s.c++;c++}
    var wi=P.wrong.indexOf(it.id);
    if(ok&&wi>=0)P.wrong.splice(wi,1);
    if(!ok&&wi<0)P.wrong.push(it.id);
  });
  Q.score=c;
  if(Q.mode==="daily"&&!P.days[dkey()])P.days[dkey()]={s:c,t:Q.items.length};
  save();
}
function vResult(){
  finishQuiz();
  var Q=S.Q,n=Q.items.length,pc=Math.round(Q.score*100/n);
  var by={};Q.items.forEach(function(it,i){var t=it.q.t;by[t]=by[t]||{c:0,t:0};by[t].t++;if(it.opts[Q.picks[i]].ok)by[t].c++});
  var rows=Object.keys(by).map(function(t){return '<tr><td>'+TYPES[t].n+'</td><td>'+by[t].c+' / '+by[t].t+'</td></tr>'}).join("");
  var wrong=Q.items.filter(function(it,i){return!it.opts[Q.picks[i]].ok});
  var rev=wrong.map(function(it){var c=it.opts.filter(function(o){return o.ok})[0].t;return '<div class="rev"><span class="tag">'+TYPES[it.q.t].n+'</span><p style="white-space:pre-line">'+esc(it.q.q)+'</p>'+(it.q.ctx?'<div class="doc" lang="ja">'+esc(it.q.ctx)+'</div>':'')+(it.q.say?'<div class="doc" lang="ja">'+esc(it.q.say)+'</div>':'')+'<p><b>Jawaban:</b> '+esc(c)+'</p><p class="muted small">'+esc(it.q.e)+'</p></div>'}).join("");
  var msg=pc>=80?"Hasil yang kuat. Lanjutkan dengan simulasi mini.":pc>=50?"Cukup baik. Ulangi materi dari soal yang salah.":"Masih awal. Baca ulang materi, lalu coba lagi.";
  return '<header><p class="eyebrow">'+esc(Q.label)+' selesai</p><div class="score">'+Q.score+'<span class="muted" style="font-size:1.6rem">/'+n+'</span></div><p class="muted">'+pc+'% benar. '+msg+'</p></header>'+
   '<section class="panel"><table class="t"><tbody>'+rows+'</tbody></table></section>'+
   '<div class="row"><button class="btn primary" data-act="menu" style="flex:1">Kembali ke menu soal</button>'+(wrong.length?'<button class="btn" data-act="redo" style="flex:1">Ulang yang salah</button>':'')+'</div>'+
   (wrong.length?'<section class="panel"><h3>Tinjau soal yang salah</h3>'+rev+'</section>':'');
}

function kanaList(set){return parseKana(KANA_BASIC).filter(function(c){return c}).map(function(c){return{k:set==="kata"?toKata(c.k):c.k,r:c.r}})}
function startGame(m){
  if(startGameX(m))return;
  if(m==="write"){var set=(S.G&&S.G.set)||"hira";S.G={mode:"write",set:set,list:shuffle(kanaList(set),Math.random),i:0};return}
  var pool=[],seen={};
  if(m==="pair")VOC.forEach(function(w){if(w.jp.length<=8)pool.push({jp:w.jp,rd:w.rd,id:w.id})});
  else{PHR.forEach(function(p){pool.push({jp:p[0],id:p[1]})});DLG.forEach(function(d){d.l.forEach(function(x){pool.push({jp:x[1],id:x[2]})})})}
  pool=pool.filter(function(x){if(seen[x.id])return false;seen[x.id]=1;return true});
  var it=shuffle(pool,Math.random).slice(0,m==="pair"?6:5);
  S.G={mode:m,L:it.map(function(x,k){return{t:x.jp,s:x.rd,k:k}}),R:shuffle(it.map(function(x,k){return{t:x.id,k:k}}),Math.random),sel:null,done:{},miss:0};
}

function mkOpts(ok,pool){
  var seen={},d=[];seen[ok]=1;
  shuffle(pool,Math.random).forEach(function(x){if(d.length<3&&x&&!seen[x]){seen[x]=1;d.push(x)}});
  return shuffle([{t:ok,ok:true}].concat(d.map(function(x){return{t:x,ok:false}})),Math.random);
}

function sentPool(){
  var out=[],seen={};
  function add(j,t){

    seen[j]=1;out.push({tk:tk,j:j,t:t});
  }
  GRAM.forEach(function(g){g.ex.forEach(function(e){add(e[0],e[1])})});
  [3,2].forEach(function(n){LV[n].g.forEach(function(g){g[2].forEach(function(e){add(e[0],e[1])})})});
  DLG.forEach(function(d){d.l.forEach(function(l){add(l[1],l[2])})});
  PHR.forEach(function(p){add(p[0],p[1])});
  return out;
}

  cv.addEventListener("pointerdown",function(e){down=true;cv.setPointerCapture(e.pointerId);var p=pt(e);ctx.beginPath();ctx.moveTo(p[0],p[1]);ctx.lineTo(p[0]+.1,p[1]);ctx.stroke();e.preventDefault()});
  cv.addEventListener("pointermove",function(e){if(!down)return;var p=pt(e);ctx.lineTo(p[0],p[1]);ctx.stroke();e.preventDefault()});

    case"quit":S.Q=null;rerender(false);break;
    case"menu":S.Q=null;rerender(false);window.scrollTo(0,0);break;
    case"wipe":if(b.getAttribute("data-sure")){P=blank();save();S.deckInit=false;toast("Progres dihapus");render()}else{b.setAttribute("data-sure","1");b.textContent="Ketuk lagi untuk menghapus";}break;
  }
});

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,getDoc} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {firebaseConfig} from "./firebase-config.js";
const app=initializeApp(firebaseConfig),db=getFirestore(app);
const ready=p=>{window.__fbPlan=p;window.dispatchEvent(new Event("planready"))};
onAuthStateChanged(getAuth(app),async function(u){
  if(!u){location.replace("index.html");return}
  window.__fbUser={n:u.displayName||"Pengguna",e:u.email||""};
  try{const sn=await getDoc(doc(db,"users",u.uid));const d=sn.exists()?sn.data():{};ready({plan:d.plan||"free",until:d.until||""})}
  catch(e){ready({plan:"free",until:""})}
});
</script>
