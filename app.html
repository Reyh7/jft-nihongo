/* ===== Modern Home / Quick Menu ===== */
.quick-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
  margin-top:12px;
}
.quick-item{
  min-width:0;
  min-height:78px;
  display:flex;
  align-items:center;
  gap:11px;
  padding:13px;
  border:1px solid var(--line);
  border-radius:18px;
  background:linear-gradient(145deg,var(--panel),var(--soft));
  color:var(--ink)!important;
  text-decoration:none!important;
  box-shadow:0 5px 16px rgba(0,0,0,.08);
  transition:transform .16s ease, border-color .16s ease, background .16s ease;
}
.quick-item:active{
  transform:scale(.98);
}
.quick-item:hover{
  border-color:var(--accent);
}
.quick-item .qi{
  width:42px;
  height:42px;
  min-width:42px;
  border-radius:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:var(--soft);
  color:var(--accent);
  font-size:1.2rem;
  font-weight:800;
  border:1px solid var(--line);
}
.quick-item div{
  min-width:0;
  display:flex;
  flex-direction:column;
  gap:3px;
}
.quick-item b{
  font-size:.92rem;
  line-height:1.15;
}
.quick-item div span{
  color:var(--ink2);
  font-size:.72rem;
  line-height:1.2;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
@media (min-width:560px){
  .quick-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:380px){
  .quick-grid{gap:8px}
  .quick-item{padding:11px;gap:8px}
  .quick-item .qi{width:38px;height:38px;min-width:38px;border-radius:12px}
}

/* More consistent rounding throughout the dashboard */
.panel{border-radius:22px!important}
.feature-card{border-radius:20px!important}
.feature-wide{border-radius:20px!important}
.roadmap .step{border-radius:15px!important}
.stats .stat{border-radius:18px!important}
.btn{border-radius:999px!important}

<title>ShigotoGo – Belajar Jepang, Raih Masa Depan</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout concept: a study notebook. One column, big kana and kanji as the main visual,
   bottom tab bar with one kanji per tab. Indigo ink on cool paper. */
:root{
  --paper:#F1F3F9; --panel:#FFFFFF; --ink:#1A2246; --ink2:#4B557D; --line:#D6DBEA;
  --accent:#2A3A8F; --accent-ink:#FFFFFF; --soft:#E4E8F7; --gold:#9A6B0C;
  --ok:#1D7A4B; --ok-bg:#E2F4EA; --bad:#B0352E; --bad-bg:#FBE7E5;
  --display:"Shippori Mincho B1","Shippori Mincho","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0D1230; --panel:#161D44; --ink:#E9ECFA; --ink2:#A4ACD3; --line:#2A3366;
  --accent:#93A3FF; --accent-ink:#0D1230; --soft:#1F2857; --gold:#E3B24C;
  --ok:#62D096; --ok-bg:#133B2B; --bad:#FF8F86; --bad-bg:#4A1E22; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0D1230; --panel:#161D44; --ink:#E9ECFA; --ink2:#A4ACD3; --line:#2A3366;
  --accent:#93A3FF; --accent-ink:#0D1230; --soft:#1F2857; --gold:#E3B24C;
  --ok:#62D096; --ok-bg:#133B2B; --bad:#FF8F86; --bad-bg:#4A1E22; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;
  padding-block:20px 104px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3,p{margin:0}
h2{font-family:var(--display);font-size:1.5rem;line-height:1.25;text-wrap:balance}
h3{font-size:1.02rem;line-height:1.35;text-wrap:balance}
.jp{font-family:var(--display)}
.eyebrow{font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);font-weight:700}
.muted{color:var(--ink2)}
.small{font-size:.88rem}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}


/* ---------- ZIP-inspired learning dashboard ---------- */
.feature-title{display:flex;align-items:end;justify-content:space-between;gap:10px}
.feature-title .muted{font-size:.78rem}
.feature-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.feature-card{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:6px;min-height:128px;padding:14px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(145deg,var(--panel),var(--soft));text-align:left;overflow:hidden}
.feature-card::after{content:"";position:absolute;width:70px;height:70px;border-radius:50%;right:-22px;bottom:-25px;background:var(--accent);opacity:.10}
.feature-card .fi{font-size:1.55rem;line-height:1}
.feature-card b{font-size:.96rem;line-height:1.25}
.feature-card span{font-size:.76rem;color:var(--ink2);line-height:1.35}
.feature-card.primary{background:linear-gradient(145deg,var(--accent),#5669d6);color:var(--accent-ink);border-color:var(--accent)}
.feature-card.primary span{color:inherit;opacity:.88}
.feature-card.primary::after{background:#fff;opacity:.12}
.feature-wide{grid-column:1/-1;min-height:104px;flex-direction:row;align-items:center}
.feature-wide .fi{font-size:1.9rem}
.roadmap{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
.roadmap .step{padding:9px 6px;text-align:center;border:1px solid var(--line);border-radius:11px;background:var(--panel);font-size:.72rem;font-weight:700}
.roadmap .step b{display:grid;place-items:center;width:24px;height:24px;margin:0 auto 5px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:.72rem}
.practice-list{display:flex;flex-direction:column;gap:8px}
.practice-row{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.practice-row .pi{font-size:1.25rem;width:30px;text-align:center}
.practice-row .pt{flex:1;min-width:0}
.practice-row .pt b{display:block;font-size:.9rem}
.practice-row .pt span{font-size:.75rem;color:var(--ink2)}
@media(max-width:390px){.feature-grid{grid-template-columns:1fr}.feature-wide{grid-column:auto}.roadmap{grid-template-columns:repeat(2,minmax(0,1fr))}}

.hero{display:flex;flex-direction:column;gap:6px;padding-top:6px}
.hero h1{font-family:var(--display);font-weight:700;font-size:clamp(64px,24vw,124px);line-height:1;color:var(--accent);letter-spacing:.02em}
.hero .lede{max-width:46ch;color:var(--ink2)}

.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;min-width:0}
.stat b{display:block;font-family:var(--display);font-size:1.7rem;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:.78rem;color:var(--ink2)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 18px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-weight:700}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.block{width:100%}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.bars{display:flex;flex-direction:column;gap:12px}
.bar-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;font-size:.9rem}
.bar-row .track{grid-column:1/-1;height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar-row .fill{height:100%;background:var(--accent);border-radius:99px}
.bar-row b{font-variant-numeric:tabular-nums}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.chip{flex:0 0 auto;min-height:38px;padding:6px 14px;border-radius:99px;border:1px solid var(--line);background:var(--panel);font-size:.92rem;font-weight:500}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}

.kgrid{display:grid;gap:8px}
.kgrid.c5{grid-template-columns:repeat(5,minmax(0,1fr))}
.kgrid.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kcell{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:68px;padding:6px 2px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.kcell .k{font-family:var(--display);font-size:1.7rem;line-height:1.1}
.kcell .r{font-size:.74rem;color:var(--ink2)}
.kcell.empty{border-style:dashed;background:transparent;visibility:hidden}

.note{background:var(--soft);border-radius:10px;padding:12px 14px;font-size:.92rem}
.note b{color:var(--gold)}

.vlist{display:flex;flex-direction:column}
.vitem{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.vitem:last-child{border-bottom:0}
.vitem .w{font-family:var(--display);font-size:1.25rem}
.vitem .rd{font-size:.82rem;color:var(--ink2);margin-left:8px;font-family:var(--body)}
.vitem .m{grid-column:1;font-size:.92rem;color:var(--ink2)}
.vitem .sp{grid-row:1/3;grid-column:2;font-size:.8rem;color:var(--accent);font-weight:700}

details.g{border:1px solid var(--line);border-radius:12px;background:var(--panel)}
details.g summary{list-style:none;cursor:pointer;padding:14px 16px;font-weight:700;display:flex;justify-content:space-between;gap:10px;align-items:center}
details.g summary::-webkit-details-marker{display:none}
details.g summary::after{content:"+";font-size:1.3rem;color:var(--accent)}
details.g[open] summary::after{content:"−"}
details.g .gb{padding:0 16px 16px;display:flex;flex-direction:column;gap:10px}
.ex{border-left:3px solid var(--accent);padding:2px 0 2px 12px}
.ex .j{font-family:var(--display);font-size:1.1rem}
.ex .t{font-size:.88rem;color:var(--ink2)}

.phr{display:grid;grid-template-columns:minmax(0,1fr);gap:0}
.phr button{display:flex;flex-direction:column;align-items:flex-start;gap:0;text-align:left;padding:10px 0;border:0;border-bottom:1px solid var(--line);background:none;width:100%}
.phr button:last-child{border-bottom:0}
.phr .j{font-family:var(--display);font-size:1.15rem}
.phr .t{font-size:.88rem;color:var(--ink2)}
.dlg{display:flex;flex-direction:column;gap:10px}
.line{display:grid;grid-template-columns:4.6rem minmax(0,1fr);gap:8px}
.line .who{font-size:.78rem;color:var(--gold);font-weight:700;padding-top:4px}
.line .j{font-family:var(--display)}
.line .t{font-size:.86rem;color:var(--ink2)}

.kanji-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.kj{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kj .big{font-family:var(--display);font-size:2.6rem;line-height:1.1;color:var(--accent)}
.kj .rd{font-size:.82rem;overflow-wrap:anywhere}
.kj .mn{font-size:.88rem;color:var(--ink2)}

.fc{min-height:240px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;padding:24px 16px;background:var(--panel);border:1px solid var(--line);border-radius:14px;width:100%}

.nt{display:flex;gap:12px;align-items:flex-start;margin:10px 0;padding:14px;border-radius:18px;background:linear-gradient(145deg,color-mix(in srgb,var(--accent) 18%,var(--panel)),var(--panel));border:1px solid var(--line)}.nt-i{font-size:1.5rem;line-height:1}.nt-b{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;font-size:.85rem}.nt-b b{font-size:.95rem}.nt-b span{opacity:.8}.nbtn{align-self:flex-start;margin-top:6px;padding:8px 14px;border-radius:12px;border:0;background:var(--accent);color:#fff;font-weight:600;text-decoration:none;font-size:.82rem}.nt-x{border:0;background:none;color:inherit;font-size:1.4rem;line-height:1;opacity:.6;padding:0 4px}.pbadge{align-self:flex-start;font-size:.68rem;font-weight:700;letter-spacing:.06em;padding:3px 9px;border-radius:99px;background:linear-gradient(90deg,#f5b301,#ff8a00);color:#fff}.prem-hero{border-radius:22px;padding:20px 18px;margin:12px 0;background:linear-gradient(145deg,color-mix(in srgb,var(--accent) 22%,var(--panel)),var(--panel));border:1px solid var(--line)}.prem-hero h2{margin:0 0 4px}.prem-hero p{margin:0 0 10px;opacity:.8}.prem-hero ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:.85rem}@media(max-width:380px){.prem-hero ul{grid-template-columns:1fr}}.lock-card ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:.88rem}
.lock-card li{color:var(--ink)}

/* ===== Tombol kembali ===== */
.tb-l{display:flex;align-items:center;gap:10px;min-width:0}
.back{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line);color:var(--ink);box-shadow:var(--shadow);flex:none;text-decoration:none}
.back .ico{width:20px;height:20px;stroke-width:2.2}
.exam-lockbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px 10px 10px;border-radius:18px;background:var(--panel);border:1px solid var(--line);box-shadow:none}.eb-main{display:flex;align-items:center;gap:12px;min-width:0}.eb-count{flex:none;min-width:56px;height:46px;padding:0 10px;border-radius:14px;display:grid;place-items:center;grid-auto-flow:column;gap:1px;background:color-mix(in srgb,var(--accent) 22%,transparent);font-size:.8rem}.eb-count b{font-size:1.2rem}.exam-lockbar .meta{min-width:0;display:flex;flex-direction:column;gap:2px}.exam-lockbar .meta b{font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.exam-lockbar .meta span{font-size:.75rem;opacity:.7}.exam-lockbar .exit{flex:none;padding:8px 12px;font-size:.8rem;border-radius:12px;min-height:0}.exam-progress{height:6px;border-radius:99px;margin:10px 2px 8px;overflow:hidden;background:color-mix(in srgb,var(--accent) 18%,transparent)}.exam-progress i{display:block;height:100%;border-radius:99px;background:var(--accent)}.exam-mode-note{text-align:center;font-size:.72rem;opacity:.6;margin:4px 0 14px}

/* ===== ShigotoGo: navy #071D49 + merah #E60023 ===== */
:root,:root:not([data-theme="dark"]){--paper:#F5F7FB;--panel:#FFFFFF;--ink:#17243B;--ink2:#5A6A85;--line:#E2E8F0;--accent:#071D49;--accent-ink:#FFFFFF;--soft:#EAEFF8;--red:#E60023;--grad:linear-gradient(135deg,#E60023,#B3001B);--hero:linear-gradient(135deg,#071D49,#10306F 60%,#1B4390);--shadow:0 8px 24px rgba(7,29,73,.08);color-scheme:light}

.pe-cover{background:var(--hero)}.pe-cover::after{background:#E60023;opacity:.4}
.plan.prem{background:var(--hero)}
.lock-ic,.dia{background:#071D49;border-color:#ffd166}
.tb-r{display:flex;align-items:center;gap:8px}

#sfab{box-shadow:0 8px 20px rgba(230,0,35,.4)}

/* ===== Animasi halus ===== */
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#app.enter>*{animation:rise .38s cubic-bezier(.2,.7,.2,1) both}
#app.enter>*:nth-child(2){animation-delay:.04s}#app.enter>*:nth-child(3){animation-delay:.08s}#app.enter>*:nth-child(4){animation-delay:.12s}#app.enter>*:nth-child(5){animation-delay:.16s}#app.enter>*:nth-child(n+6){animation-delay:.2s}
.btn,.mi,.sk-i,.ft-i,.pkg,.opt,.hbtn,.chip,.qn{transition:transform .15s ease,background-color .2s ease,border-color .2s ease,box-shadow .2s ease}
.btn:active,.mi:active,.pkg:active,.opt:active,.hbtn:active{transform:scale(.97)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* ===== Logo per mode ===== */
.brand .logo{width:46px;height:46px;border-radius:14px;object-fit:cover;box-shadow:0 4px 12px rgba(7,29,73,.25)}

/* ===== Beranda lebih kaya: bento skill + grup fitur ===== */
.skills{grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;background:none;border:0;box-shadow:none;padding:0}
.skills .sk{position:relative;overflow:hidden;grid-column:span 2;align-items:flex-start;justify-content:flex-end;gap:2px;min-height:104px;padding:14px;border-radius:22px;color:#fff;text-align:left;text-decoration:none;box-shadow:0 10px 22px rgba(7,29,73,.18)}

.skills .sk:nth-child(1){background:linear-gradient(145deg,#10B981,#047857)}
.skills .sk:nth-child(2){background:linear-gradient(145deg,#3B82F6,#1D4ED8)}
.skills .sk:nth-child(3){background:linear-gradient(145deg,#F87171,#DC2626)}
.skills .sk:nth-child(4){background:linear-gradient(145deg,#FBBF24,#EA580C)}
.skills .sk:nth-child(5){background:linear-gradient(145deg,#A78BFA,#6D28D9)}
.more{gap:12px}
.ft-group{background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:16px 12px 14px;box-shadow:var(--shadow)}
.grp{margin:0 4px 14px;font-size:.78rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.ft-group .ft-grid{gap:14px 6px}
.ft-i{background:linear-gradient(145deg,color-mix(in srgb,var(--h) 20%,var(--panel)),color-mix(in srgb,var(--h) 8%,var(--panel)));border:1px solid color-mix(in srgb,var(--h) 32%,transparent);color:var(--h);box-shadow:none}
.ft{--h:var(--accent)}

:root:not([data-theme="dark"]) .hero .brand .lg-l{display:block}:root:not([data-theme="dark"]) .hero .brand .lg-d{display:none}
:root[data-theme="dark"] .hero{background:linear-gradient(135deg,#0B1F4A,#1B3F8A);border:1px solid #2A4A8F;box-shadow:0 14px 34px rgba(0,0,0,.45)}

/* ===== Roadmap, akurasi, audio modern ===== */
.roadmap{position:relative;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;padding-top:6px}
.roadmap::before{content:"";position:absolute;left:12.5%;right:12.5%;top:26px;height:3px;border-radius:3px;background:linear-gradient(90deg,#3B82F6,#10B981,#F59E0B,#E60023);opacity:.45}
.roadmap .step{position:relative;border:0!important;background:none!important;padding:0 2px;text-align:center;font-size:.78rem;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0;border-radius:0!important}
.roadmap .step b{width:40px;height:40px;margin:0 0 6px;font-size:.95rem;color:#fff;position:relative;z-index:1;box-shadow:0 0 0 4px var(--panel),0 6px 14px rgba(7,29,73,.25)}
.roadmap .step:nth-child(1) b{background:#3B82F6}.roadmap .step:nth-child(2) b{background:#10B981}.roadmap .step:nth-child(3) b{background:#F59E0B}.roadmap .step:nth-child(4) b{background:#E60023}
.roadmap .step small{font-weight:500;color:var(--ink2);font-size:.66rem;line-height:1.2}
.bars{gap:16px}
.bar-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;align-items:end;--h:#3B82F6}
.bar-row:nth-child(2){--h:#10B981}.bar-row:nth-child(3){--h:#F87171}.bar-row:nth-child(4){--h:#F59E0B}.bar-row:nth-child(5){--h:#8B5CF6}.bar-row:nth-child(6){--h:#06B6D4}.bar-row:nth-child(7){--h:#EC4899}
.bar-row>span{display:flex;flex-direction:column;line-height:1.25;font-weight:700;font-size:.9rem;padding-left:12px;position:relative}
.bar-row>span::before{content:"";position:absolute;left:0;top:.28em;width:6px;height:6px;border-radius:50%;background:var(--h);box-shadow:0 0 0 3px color-mix(in srgb,var(--h) 25%,transparent)}
.bar-row>span .muted{font-weight:400;font-size:.72rem}
.bar-row>b{font-size:.95rem;color:var(--h)}
.bar-row .track{grid-column:1/-1;height:10px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar-row .fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--h),color-mix(in srgb,var(--h) 60%,#fff));transition:width .8s cubic-bezier(.2,.7,.2,1);animation:grow .9s cubic-bezier(.2,.7,.2,1) both}
@keyframes grow{from{width:0}}
.h-ico{display:flex;align-items:center;gap:8px}
.h-ico .ico{width:20px;height:20px;stroke:var(--accent)}
.panel .row{gap:10px;flex-wrap:wrap}

.panel .btn[data-act="slow"]{border-radius:99px;padding-inline:18px}
.help{margin-top:12px;border:1px solid var(--line);border-radius:14px;background:var(--soft);padding:0 14px}
.help summary{cursor:pointer;padding:12px 0;font-weight:700;font-size:.86rem;list-style:none;display:flex;justify-content:space-between}
.help summary::after{content:"+";font-size:1.1rem;color:var(--ink2)}
.help[open] summary::after{content:"–"}

/* ===== Fitur penting di atas ===== */
.ft-group.top{background:none;border:0;box-shadow:none;padding:0}

.ft-group.top .ft-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ft-group.top .ft{flex-direction:row;align-items:center;gap:12px;padding:12px;border-radius:20px;text-align:left;background:linear-gradient(145deg,color-mix(in srgb,var(--h) 14%,var(--panel)),var(--panel));border:1px solid color-mix(in srgb,var(--h) 35%,transparent);box-shadow:var(--shadow)}
.ft-group.top .ft-i{width:52px;height:52px;max-width:none;flex:none;aspect-ratio:auto}

/* ===== AI Sensei modern ===== */
#ssheet{height:78vh;max-height:680px;border:0;border-radius:28px 28px 0 0;box-shadow:0 -12px 40px rgba(7,29,73,.3);overflow:hidden;animation:sheetUp .32s cubic-bezier(.2,.8,.2,1) both}

#ssheet::before{content:"";position:absolute;top:8px;left:50%;width:40px;height:4px;margin-left:-20px;border-radius:4px;background:var(--line)}
.sh-h{padding:22px 16px 12px;gap:10px}
.sh-av{display:grid;place-items:center;width:42px;height:42px;border-radius:14px;background:var(--hero);color:#fff;font:700 1.2rem var(--display);flex:none;box-shadow:0 6px 14px rgba(7,29,73,.3)}

.sh-t{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.sh-t b{font-size:1rem}
.sh-t span{font-size:.74rem;color:var(--ink2);display:flex;align-items:center;gap:6px}
.sh-t .dot{width:7px;height:7px;border-radius:50%;background:#10B981;box-shadow:0 0 0 3px rgba(16,185,129,.22)}
.sh-ib{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--soft);color:var(--ink);display:grid;place-items:center;cursor:pointer;flex:none}
.sh-ib .ico{width:19px;height:19px}
.sh-b{padding:16px;gap:12px}
.sh-wel{text-align:center;padding:10px 6px 2px}.sh-wel h4{margin:0 0 4px;font-size:1.15rem}.sh-wel p{margin:0;color:var(--ink2);font-size:.88rem}
.sug{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.sug .chip{width:100%;justify-content:flex-start;text-align:left;border-radius:16px;padding:12px 14px;min-height:0;background:var(--panel);box-shadow:var(--shadow);font-weight:600}
.sug .chip::before{content:"→";color:var(--red);margin-right:8px;font-weight:700}
.bub{max-width:86%;line-height:1.5;font-size:.92rem}
.bub.assistant{justify-self:start;border-radius:6px 18px 18px 18px}
.bub.user{justify-self:end;border-radius:18px 18px 6px 18px;background:var(--accent);color:var(--accent-ink);border-color:transparent}
.bub .say{display:inline-grid;place-items:center;width:26px;height:26px;margin-left:6px;vertical-align:middle;border-radius:50%;border:0;background:var(--soft);color:var(--ink2);cursor:pointer}
.bub .say .ico{width:14px;height:14px}
.sh-f{padding:10px 12px calc(12px + env(safe-area-inset-bottom,0px));gap:10px;align-items:flex-end}
.sh-ta{border-radius:22px!important;padding:12px 16px!important;max-height:110px;resize:none;background:var(--soft)!important;border-color:transparent!important}
.sh-send{width:46px;height:46px;border-radius:50%;border:0;background:var(--grad);color:#fff;display:grid;place-items:center;cursor:pointer;flex:none;box-shadow:0 6px 14px rgba(230,0,35,.35);transition:transform .15s}
.sh-send:active{transform:scale(.92)}.sh-send:disabled{opacity:.5}
.sh-send .ico{width:20px;height:20px;stroke:#fff}

.btn.wa{display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;border:1.5px solid #25D366;background:color-mix(in srgb,#25D366 10%,var(--panel));color:var(--ink);font-weight:700;margin-top:12px;border-radius:99px}
.btn.wa .ico{stroke:#25D366;width:20px;height:20px}

/* ===== Latihan JLPT: lebih ringkas dan jelas ===== */
.menu.lv1{grid-template-columns:1fr}
.mi.lvq{display:grid;grid-template-columns:1fr auto;grid-template-areas:"a go" "b go" "pg pg" "pgt pgt";text-align:left;align-items:center;column-gap:10px}
.lvq .a{grid-area:a;font-weight:700}.lvq .b{grid-area:b;display:block}.lvq .go{grid-area:go}
.lvq .pg{grid-area:pg;display:block;height:6px;border-radius:99px;background:var(--soft);overflow:hidden;margin-top:10px}
.lvq .pg i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .6s ease}
.lvq .pgt{grid-area:pgt;display:block;font-size:.7rem;color:var(--ink2);margin-top:5px}
.lrows{display:flex;flex-direction:column}
.lrow{display:flex;align-items:center;gap:10px;width:100%;padding:13px 2px;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);text-align:left;cursor:pointer}
.lrow:last-child{border-bottom:0}.lrow.off{opacity:.55;cursor:default}
.lrow b{min-width:64px}.lrow .muted{flex:1}.lrow .lk{width:22px;text-align:center}
.lrow b{flex:1;min-width:0;font-size:.9rem}.lrow .muted{flex:0 0 auto;text-align:right}.lrows{margin-top:4px}

/* ===== Beranda bawah: ringkas, tidak tertutup tombol Sensei ===== */
body{padding-block:14px 190px}
.kick{margin:14px 0 6px;font-size:.7rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.cont h3+.kick{margin-top:10px}
.cont .mi.rec{background:linear-gradient(145deg,color-mix(in srgb,var(--accent) 16%,var(--panel)),var(--panel));border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
#sfab{width:48px;height:48px;font-size:1.35rem;opacity:.95}

/* ===== AI Sensei menonjol ===== */
.sensei-card{position:relative;overflow:hidden;border-radius:24px;padding:16px;background:var(--hero);color:#fff;box-shadow:0 12px 28px rgba(7,29,73,.28);display:flex;flex-direction:column;gap:10px}
.sensei-card::after{content:"";position:absolute;right:-30px;top:-34px;width:120px;height:120px;border-radius:50%;background:#E60023;opacity:.35}
.sensei-card>*{position:relative;z-index:1}
.sc-top{display:flex;align-items:center;gap:12px}
.sc-av{display:grid;place-items:center;width:46px;height:46px;border-radius:15px;background:rgba(255,255,255,.18);font:700 1.4rem var(--display);flex:none}
.sc-t{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}.sc-t b{font-size:1.05rem}.sc-t span{font-size:.74rem;color:rgba(255,255,255,.85)}
.sc-pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:99px;background:#ffd166;color:#3a2600;font-size:.62rem;font-weight:800;letter-spacing:.06em}
.sc-pill svg{width:12px;height:12px}
.sensei-card p{margin:0;font-size:.88rem;color:rgba(255,255,255,.92);line-height:1.45}
.sc-chips{display:flex;flex-wrap:wrap;gap:8px}
.sc-chips button{border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:#fff;border-radius:99px;padding:7px 12px;font-size:.78rem;cursor:pointer}
.sc-cta{align-self:flex-start;border:0;border-radius:99px;padding:11px 20px;background:var(--grad);color:#fff;font-weight:700;font-size:.92rem;box-shadow:0 8px 18px rgba(230,0,35,.35);cursor:pointer}
#sfab{width:auto;height:48px;padding:0 16px 0 7px;border-radius:99px;display:flex;align-items:center;gap:8px;font:700 .86rem var(--body);animation:sfPulse 3s ease-in-out infinite}
#sfab .fk{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.22);font:700 1.15rem var(--display)}
@keyframes sfPulse{0%,100%{box-shadow:0 8px 20px rgba(230,0,35,.4)}50%{box-shadow:0 8px 26px rgba(230,0,35,.6),0 0 0 6px rgba(230,0,35,.12)}}

/* ===== Sensei: bicara dua arah ===== */
.sh-talk{border:1px solid var(--line);background:var(--soft);color:var(--ink2);border-radius:99px;padding:8px 13px;font-size:.78rem;font-weight:700;cursor:pointer;flex:none}
.sh-talk.on{background:var(--red);border-color:var(--red);color:#fff}
.sh-lang{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--soft);color:var(--ink);font-size:.74rem;font-weight:800;cursor:pointer;flex:none}
.sh-mic{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--soft);color:var(--ink);display:grid;place-items:center;cursor:pointer;flex:none}
.sh-mic .ico{width:20px;height:20px}
.sh-mic.on{background:var(--red);border-color:var(--red);color:#fff;animation:micPulse 1.2s ease-in-out infinite}
@keyframes micPulse{0%,100%{box-shadow:0 0 0 0 rgba(230,0,35,.45)}50%{box-shadow:0 0 0 9px rgba(230,0,35,0)}}

/* ===== Suara dan dikte ===== */
.vs{display:flex;flex-direction:column;gap:6px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.vs h4{margin:0;font-size:1rem}
.vs-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vs-c{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:92px;border-radius:22px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;transition:border-color .2s,background-color .2s,transform .15s}
.vs-c b{font-size:1.1rem}.vs-c span{font-size:.74rem;color:var(--ink2)}
.vs-c.on{border-color:var(--accent);background:linear-gradient(180deg,var(--panel),color-mix(in srgb,var(--red) 14%,var(--panel)))}
.vs-row{display:flex;gap:8px;align-items:center}
.vs-sel{flex:1;min-width:0;font:inherit;font-size:.88rem;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:11px 12px}
.vs-seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--soft);border-radius:14px;padding:4px;gap:4px}
.vs-o{border:0;background:none;color:var(--ink2);border-radius:11px;padding:10px 4px;font-weight:700;font-size:.84rem;cursor:pointer}
.vs-o.on{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
</style>

var NETV={a:null,tk:0,bad:0};
function netOn(){try{if(localStorage.getItem("jft_netvoice")==="0")return false}catch(e){}return NETV.bad<3&&navigator.onLine!==false&&!!window.Audio}
function netChunks(t){
  var out=[],cur="";
  String(t||"").replace(/\s+/g," ").trim().split(/(?<=[。！？!?.、,])/).forEach(function(p){
    while(p.length>170){if(cur){out.push(cur);cur=""}out.push(p.slice(0,170));p=p.slice(170)}
    if((cur+p).length>170){out.push(cur);cur=p}else cur+=p;
  });
  if(cur.trim())out.push(cur);
  return out.filter(function(x){return x.replace(/[\s。、！？!?.,]/g,"")});
}
function netSpeak(text,lang,slow,done,fail){
  var ch=netChunks(text),tk=++NETV.tk,n=0;

  var next=function(){
    if(tk!==NETV.tk)return;
    if(n>=ch.length){done();return}
    var a=new Audio("https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl="+lang+"&ttsspeed="+(slow?"0.3":"1")+"&q="+encodeURIComponent(ch[n]));

    var bad=function(){if(tk!==NETV.tk)return;NETV.a=null;NETV.bad++;if(first)fail();else done()};
    a.onerror=bad;var p;try{p=a.play()}catch(e){bad();return}if(p&&p.catch)p.catch(bad);

var AUD={tok:0};

      var go=function(){setTimeout(function(){step(i+1)},slow?900:550)};

        var w=L[i].w,v=w==="B"?V.B:V.A;if(v)u.voice=v;

}

/* ---------- Views ---------- */
function rowItem(m){
  if(!m.a)return'<div class="mi off"><span class="a">'+esc(m.t)+'</span><span class="b">Belum tersedia · dalam pengembangan</span></div>';
  var s=status(m);
  return'<button class="mi" data-act="ropen" data-v="'+m.id+'"><span class="a">'+esc(m.t)+(isLocked(m)?' 💎':'')+' '+(m.l==="x"?'':pill(s))+'</span><span class="b">'+esc(m.d)+(m.c?' · '+esc(m.c):'')+'</span><span class="go">'+(s==="done"?'✓':'→')+'</span></button>';
}
function vRoadmap(){
  var rec=recLevel(),ov=overall(),a2=lvStat("a2"),skip=false;
  if(rec)for(var i=0;i<LVL.length&&LVL[i].id!==rec.id;i++)if(!lvStat(LVL[i].id).av.length)skip=true;
  var cards=LVL.map(function(L,i){
    var s=lvStat(L.id),nx=nextItem(L.id),isRec=rec&&rec.id===L.id,miss=s.items.length-s.av.length;
    var cta=s.av.length&&nx?'<button class="btn primary block" data-act="ropen" data-v="'+nx.id+'">'+(s.st==="new"?"Mulai Belajar":s.st==="prog"?"Lanjutkan":"Ulangi materi")+'</button>':'<p class="devnote">Materi level ini belum tersedia. Sedang dalam pengembangan.</p>';
    var lis=s.items.map(function(m){
      var f=frac(m);
      return'<li class="rgi"><div class="rgt"><b>'+esc(m.t)+(isLocked(m)?' 💎':'')+'</b><small class="muted">'+(m.a?esc(m.c||STL[status(m)]):'Belum tersedia')+'</small>'+(m.a?bar(pct(f)):'')+'</div>'+(m.a?'<button class="btn mini" data-act="ropen" data-v="'+m.id+'" aria-label="Buka '+esc(m.t)+'">'+(f>=1?'✓':'Buka')+'</button>':'<span class="pill s-dev">Segera</span>')+'</li>';
    }).join("");
    return'<article class="rcard s-'+s.st+(isRec?' rec':'')+'"><div class="rhead"><span class="rnum">'+(i+1)+'</span><div class="rtt"><h3>'+esc(L.n)+'</h3><div class="pills">'+pill(s.st)+(isRec?'<span class="pill s-rec">Disarankan</span>':'')+'</div></div></div>'+
     '<p class="muted">'+esc(L.d)+'</p><p class="rgoal"><b>Tujuan:</b> '+esc(L.g)+'</p>'+
     '<p class="small muted">'+s.items.length+' kelompok materi · '+s.av.length+' tersedia'+(miss?' · '+miss+' dalam pengembangan':'')+'</p>'+
     (s.av.length?'<div class="rprog"><span>'+s.pct+'%</span>'+bar(s.pct)+'<small class="muted">'+s.done+'/'+s.av.length+' selesai</small></div>':'')+
     '<details class="rg"><summary>Kelompok materi</summary><ul class="rgl">'+lis+'</ul></details>'+cta+'</article>';
  }).join("");
  return'<header class="pg-hd"><p class="eyebrow">Roadmap</p><h2>Jalur belajar bahasa Jepang</h2></header>'+
   '<div class="note"><b>Urutan belajar yang disarankan.</b> A2 / JFT-Basic dan JLPT adalah sistem ujian yang berbeda, jadi roadmap ini bukan penyetaraan sertifikat. Level lain tetap boleh dibuka kapan saja.</div>'+
   '<section class="panel"><div class="ovrow"><b class="bigp">'+ov.pct+'%</b><span class="muted small">'+ov.done+' dari '+ov.t+' kelompok materi tersedia selesai</span></div>'+bar(ov.pct)+
   (rec?'<p class="small">Disarankan sekarang: <b>'+esc(rec.n)+'</b>'+(a2.st==="done"&&rec.id!=="a2"?'.':'.')+(skip?' Level yang materinya belum tersedia dilewati dalam rekomendasi.':'')+'</p>':'<p class="small">Semua materi yang tersedia sudah selesai. Level baru akan muncul saat materinya ditambahkan.</p>')+'</section>'+
   '<div class="rmap">'+cards+'</div>';
}
function vBelajar(){
  var rec=recLevel();
  var lv=LVL.map(function(L){
    var s=lvStat(L.id),open=(rec&&rec.id===L.id)||(!rec&&L.id==="a2");
    return'<details class="lvd"'+(open?' open':'')+'><summary><span class="lvn">'+esc(L.n)+'</span>'+pill(s.st)+(s.av.length?'<small class="muted">'+s.pct+'%</small>':'')+'</summary><div class="menu">'+s.items.map(rowItem).join("")+'</div></details>';
  }).join("");

GRAM.push(
 {t:"Bentuk potensial · bisa melakukan",r:"Kelompok る: 〜られる (食べる → 食べられる, 見る → 見られる). Kelompok u: akhiran う-row diganti え-row + る (書く → 書ける, 飲む → 飲める, 話す → 話せる, 買う → 買える). する → できる, 来る → 来られる. Objek boleh memakai が: 日本語が 話せます.",
  ex:[["日本語が 話せます。","Saya bisa berbicara bahasa Jepang."],["納豆は 食べられません。","Saya tidak bisa makan natto."],["明日の 会議に 来られますか。","Apakah Anda bisa datang ke rapat besok?"],["漢字が 読めますか。","Apakah Anda bisa membaca kanji?"]]},
 {t:"Bentuk volisional · 〜よう / 〜おう",r:"Ajakan atau tekad (bentuk biasa dari 〜ましょう). Kelompok る: buang る + よう (食べる → 食べよう). Kelompok u: う-row diganti お-row + う (行く → 行こう, 飲む → 飲もう). する → しよう, 来る → 来よう. 〜ようと思う = berniat …. 〜ようとする = hendak / mencoba ….",
  ex:[["一緒に 帰ろう。","Ayo pulang bersama."],["来年 日本で 働こうと 思っています。","Saya berniat bekerja di Jepang tahun depan."],["出かけようと した とき、電話が 鳴りました。","Ketika hendak pergi, telepon berdering."]]},
 {t:"Kondisional · と, ば, たら, なら",r:"と: hasil otomatis atau kebiasaan (春に なると 花が 咲く). ば: syarat umum (bentuk ば: 安ければ, 行けば, 食べれば → 食べれば, する → すれば). たら: kalau / setelah …, paling luas dipakai. なら: kalau memang …, menanggapi informasi lawan bicara. Hasil dengan と tidak dipakai untuk ajakan atau permintaan.",
  ex:[["春に なると、花が 咲きます。","Kalau musim semi tiba, bunga mekar."],["安ければ、買います。","Kalau murah, saya beli."],["駅に 着いたら、連絡して ください。","Kalau sudah sampai di stasiun, tolong kabari."],["京都へ 行くなら、秋が いいですよ。","Kalau mau ke Kyoto, musim gugur bagus."]]},
 {t:"Memberi dan menerima",r:"あげる = memberi (dari saya ke orang lain). くれる = orang lain memberi kepada saya atau pihak saya. もらう = saya menerima dari orang lain. Dengan て, ketiganya berarti melakukan sesuatu sebagai bantuan: 〜てあげる, 〜てくれる, 〜てもらう. Bentuk sopan: さしあげる, くださる, いただく.",
  ex:[["友達に 本を 貸して あげました。","Saya meminjamkan buku kepada teman."],["先生が 日本語を 教えて くださいました。","Guru mengajarkan bahasa Jepang kepada saya."],["兄に 荷物を 運んで もらいました。","Saya dibantu kakak membawakan barang."],["母は 私に セーターを くれました。","Ibu memberi saya sweter."]]},
 {t:"〜ておく · 〜てある · 〜てみる · 〜てくる / ていく",r:"〜ておく = melakukan lebih dulu sebagai persiapan. 〜てある = keadaan hasil tindakan seseorang (kata kerja transitif + が). 〜てみる = mencoba …. 〜てくる = mulai berubah menuju sekarang. 〜ていく = terus berubah ke depan.",
  ex:[["会議の まえに 資料を 読んで おきます。","Sebelum rapat, saya baca dulu materinya."],["窓が 開けて あります。","Jendelanya sudah dibukakan."],["この ラーメンを 食べて みて ください。","Cobalah ramen ini."],["寒く なって きました。","Cuaca mulai dingin."]]},
 {t:"〜ところだ · tahap kejadian",r:"V-る + ところだ = hendak …. V-ている + ところだ = sedang …. V-た + ところだ = baru saja …. Berbeda dengan 〜たばかり yang lebih longgar soal waktu.",
  ex:[["今から 出かけるところです。","Saya hendak berangkat sekarang."],["いま 食事を している ところです。","Saya sedang makan."],["ちょうど 家に 着いた ところです。","Saya baru saja sampai di rumah."]]},
 {t:"Klausa penjelas kata benda",r:"Kalimat biasa (bentuk kamus) bisa langsung menerangkan kata benda. Subjek klausa memakai が atau の. Bentuk な-adj: 静かな 町. Bentuk lampau boleh dipakai di dalam klausa.",
  ex:[["これは 母が 作った ケーキです。","Ini kue yang dibuat ibu saya."],["昨日 会った 人は 田中さんです。","Orang yang saya temui kemarin adalah Tn. Tanaka."],["私が 住んでいる 町は 静かです。","Kota tempat saya tinggal itu tenang."]]},
 {t:"Dugaan · でしょう, かもしれません, と思います",r:"でしょう = mungkin (cukup yakin). かもしれません = mungkin saja (kurang yakin). と思います = menurut saya …. 〜かどうか = apakah … atau tidak. 疑問詞 + か = (siapa, kapan, di mana) … itu.",
  ex:[["明日は 雪が 降るでしょう。","Besok mungkin turun salju."],["電車が 遅れるかもしれません。","Mungkin kereta terlambat."],["彼が 来るかどうか わかりません。","Saya tidak tahu apakah dia akan datang atau tidak."],["いつ 出発するか 教えて ください。","Tolong beri tahu kapan berangkat."]]},
 {t:"〜すぎる · 〜やすい · 〜にくい · 〜はじめる",r:"Batang kata kerja (bentuk ます tanpa ます) + すぎる = terlalu …. + やすい = mudah …. + にくい = sulit …. + はじめる / おわる / つづける = mulai / selesai / terus …. Kata sifat い: 高い → 高すぎる. な-adj: 静か → 静かすぎる.",
  ex:[["昨日は 食べすぎました。","Kemarin saya makan terlalu banyak."],["この ペンは 書きやすいです。","Pena ini mudah dipakai menulis."],["この 道は 歩きにくいです。","Jalan ini sulit dilalui."],["雨が 降りはじめました。","Hujan mulai turun."]]},
 {t:"Pasif dan kausatif-pasif",r:"Pasif: kelompok る: 〜られる; kelompok u: あ-row + れる; する → される; 来る → 来られる. Pelaku ditandai に. Pasif dampak: terkena sesuatu yang merugikan (雨に 降られた). Kausatif-pasif 〜させられる = dipaksa melakukan.",
  ex:[["先生に ほめられました。","Saya dipuji guru."],["電車で 足を 踏まれました。","Kaki saya terinjak di kereta."],["子どもの とき、母に 野菜を 食べさせられました。","Waktu kecil, saya dipaksa ibu makan sayur."],["上司に 残業を させられました。","Saya disuruh lembur oleh atasan."]]},
 {t:"Sonkeigo · bahasa hormat",r:"Meninggikan tindakan orang yang dihormati. Pola: お + batang V + になる (お読みになる). Pasif hormat: 〜れる / 〜られる. Kata khusus: いらっしゃる, 召し上がる, おっしゃる, なさる, ご覧になる, くださる. Permintaan hormat: お + batang V + ください. Lihat tabel di Materi, tab Keigo.",
  ex:[["先生は もう お帰りに なりました。","Guru sudah pulang."],["社長は 明日 いらっしゃいます。","Direktur akan datang besok."],["どうぞ 召し上がって ください。","Silakan dimakan."],["こちらに お座りください。","Silakan duduk di sini."]]},
 {t:"Kenjōgo · bahasa rendah hati",r:"Merendahkan diri sendiri untuk menghormati lawan bicara. Pola: お + batang V + する / いたす (お持ちする). Kata khusus: 伺う, 申す, 参る, いたす, 拝見する, いただく, 存じる. Dipakai pada pelanggan, atasan, dan situasi resmi.",

function startQuiz(mode,arg){
  if(!isPrem()){
    if(mode==="full"){toast("Ujian penuh hanya untuk Premium");return}
    if(mode==="type"&&/^n[234]/.test(arg)){toast("Materi "+TYPES[arg].n+" hanya untuk Premium");return}
    if(mode==="sim"||(mode==="type"&&(arg==="c"||arg==="d"))){
      var fk=mode==="sim"?"sim":arg;
      if(!freeOK(fk)){toast(mode==="sim"?"Simulasi gratis minggu ini sudah dipakai. Premium: simulasi tanpa batas.":"Jatah gratis hari ini sudah dipakai. Besok ada lagi, atau pakai Premium untuk tanpa batas.");return}
      frGet()[fk]++;save()
    }
  }
  var ids=[],label="",r=Math.random;
  if(mode==="daily"){
    r=rng(Number(dkey().replace(/-/g,"")));label="Soal harian";
    var cnt={m:3,k:3,c:2,d:2};
    ["m","k","c","d"].forEach(function(t){ids=ids.concat(shuffle(idsOf(t),r).slice(0,cnt[t]))});
  }else if(mode==="type"&&/^n[2-5]s$/.test(arg)){label="Simulasi N"+arg[1];var bs=arg.slice(0,2);[[bs,10],[bs+"c",6],[bs+"d",4]].forEach(function(p){ids=ids.concat(shuffle(idsOf(p[0]),r).slice(0,p[1]))})}
  else if(mode==="type"){label="Latihan "+TYPES[arg].n;ids=shuffle(idsOf(arg),r).slice(0,(isPrem()||(arg!=="c"&&arg!=="d"))?10:5)}
  else if(mode==="sim"){label="Simulasi mini";["m","k","c","d"].forEach(function(t){ids=ids.concat(shuffle(idsOf(t),r).slice(0,5))})}
  else if(mode==="full"){label="Ujian penuh";var cf={m:12,k:12,c:13,d:13};["m","k","c","d"].forEach(function(t){ids=ids.concat(shuffle(idsOf(t),r).slice(0,cf[t]))})}
  else if(mode==="redo"){label="Ulang soal yang salah";ids=P.wrong.filter(function(i){return QB[i]}).slice(0,20)}
  if(!ids.length){toast("Belum ada soal untuk dikerjakan");return}
  S.Q={mode:mode,label:label,items:build(ids,r),i:0,picks:[],reveal:{},saved:false};
  if(mode==="full"){S.Q.t0=Date.now();S.Q.end=S.Q.t0+3600000;clearInterval(S.tmr);S.tmr=setInterval(fullTick,1000)}
  syncExamLockUI();
  go("soal");
}

  ["Seseorang bertanya 「ごしゅっしんは どちらですか。」Jawaban yang tepat?","インドネシアの ジャカルタです。",["二十五さいです。","ともだちと きました。","くるまで きました。"],"ごしゅっしん = asal daerah."],

  ["Anda ingin meminta rekan menunjukkan cara memakai mesin. Apa yang Anda ucapkan?","つかいかたを おしえて ください。",["つかいかたを おしえましょうか。","つかいかたを おしえて あげます。","つかいかたが わかります。"],"〜てください = tolong …. 〜ましょうか adalah tawaran."],

function mkOpts(ok,pool){
  var seen={},d=[];seen[ok]=1;
  shuffle(pool,Math.random).forEach(function(x){if(d.length<3&&x&&!seen[x]){seen[x]=1;d.push(x)}});
  return shuffle([{t:ok,ok:true}].concat(d.map(function(x){return{t:x,ok:false}})),Math.random);
}
function sayOf(v){return v.rd&&v.jp.indexOf("〜")<0?v.rd.split(" / ")[0]:v.jp.replace(/〜/g,"")}
function mcItems(kind){
  var L;
  if(kind==="kana"){
    L=kanaList("hira").concat(kanaList("kata"));
    return shuffle(L,Math.random).slice(0,20).map(function(c){return{h:"Bagaimana cara membaca huruf ini?",big:c.k,say:c.k,opts:mkOpts(c.r,L.map(function(x){return x.r})),ans:c.r,e:c.k+" dibaca “"+c.r+"”."}});
  }
  if(kind==="listen"){
    L=VOC.filter(function(v){return v.jp.length<=8&&v.jp.indexOf("〜")<0&&v.jp.indexOf("…")<0});
    return shuffle(L,Math.random).slice(0,15).map(function(v){var s=sayOf(v);
      return{h:"Dengarkan, lalu pilih tulisan yang sesuai.",big:"🎧",say:s,opts:mkOpts(v.jp,L.filter(function(w){return sayOf(w)!==s}).map(function(w){return w.jp})),ans:v.jp,e:v.jp+(v.rd?" ("+v.rd+")":"")+" = "+v.id}});
  }
  if(kind==="rush"){
    L=VOC.filter(function(v){return v.jp.length<=10&&v.jp.indexOf("…")<0});
    return shuffle(L,Math.random).slice(0,100).map(function(v){return{h:"Apa artinya?",big:v.jp,sub:v.rd,opts:mkOpts(v.id,L.map(function(w){return w.id})),ans:v.id}});
  }
  if(kind==="kanji"){
    return shuffle(KANJI,Math.random).slice(0,20).map(function(k){return{h:"Apa arti kanji ini?",big:k[0],opts:mkOpts(k[2],KANJI.map(function(x){return x[2]})),ans:k[2],e:k[0]+" dibaca "+k[1]+", artinya "+k[2]+"."}});
  }
  if(kind==="verb"){
    var F=["ます","て","ない","た"];
    return shuffle(VERBS,Math.random).slice(0,15).map(function(v){
      var fi=3+Math.floor(Math.random()*4),cand=[3,4,5,6].filter(function(i){return i!==fi}).map(function(i){return v[i]}),extra=VERBS.map(function(w){return w[fi]});

    });

  return shuffle(PART,Math.random).slice(0,15).map(function(p){return{h:p[3],big:p[0],opts:mkOpts(p[1],p[2]),ans:p[1],e:p[4]}});
}
function sentPool(){
  var out=[],seen={};
  function add(j,t){
    var tk=String(j).replace(/\s+$/,"").split(/\s+/);
    if(tk.length<3||tk.length>7||seen[j]||j.slice(0,-1).search(/[。？]/)>=0)return;
    seen[j]=1;out.push({tk:tk,j:j,t:t});
  }
  GRAM.forEach(function(g){g.ex.forEach(function(e){add(e[0],e[1])})});
  [3,2].forEach(function(n){LV[n].g.forEach(function(g){g[2].forEach(function(e){add(e[0],e[1])})})});
  DLG.forEach(function(d){d.l.forEach(function(l){add(l[1],l[2])})});
  PHR.forEach(function(p){add(p[0],p[1])});
  return out;
}
