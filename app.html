/* ===== Modern Home / Quick Menu ===== */
.quick-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
  margin-top:12px;
}
.quick-item{
  min-width:0;
  min-height:78px;
  display:flex;
  align-items:center;
  gap:11px;
  padding:13px;
  border:1px solid var(--line);
  border-radius:18px;
  background:linear-gradient(145deg,var(--panel),var(--soft));
  color:var(--ink)!important;
  text-decoration:none!important;
  box-shadow:0 5px 16px rgba(0,0,0,.08);
  transition:transform .16s ease, border-color .16s ease, background .16s ease;
}
.quick-item:active{
  transform:scale(.98);
}
.quick-item:hover{
  border-color:var(--accent);
}
.quick-item .qi{
  width:42px;
  height:42px;
  min-width:42px;
  border-radius:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:var(--soft);
  color:var(--accent);
  font-size:1.2rem;
  font-weight:800;
  border:1px solid var(--line);
}
.quick-item div{
  min-width:0;
  display:flex;
  flex-direction:column;
  gap:3px;
}
.quick-item b{
  font-size:.92rem;
  line-height:1.15;
}
.quick-item div span{
  color:var(--ink2);
  font-size:.72rem;
  line-height:1.2;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
@media (min-width:560px){
  .quick-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:380px){
  .quick-grid{gap:8px}
  .quick-item{padding:11px;gap:8px}
  .quick-item .qi{width:38px;height:38px;min-width:38px;border-radius:12px}
}

/* More consistent rounding throughout the dashboard */
.panel{border-radius:22px!important}
.feature-card{border-radius:20px!important}
.feature-wide{border-radius:20px!important}
.roadmap .step{border-radius:15px!important}
.stats .stat{border-radius:18px!important}

<title>JFT Basic Nihongo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout concept: a study notebook. One column, big kana and kanji as the main visual,
   bottom tab bar with one kanji per tab. Indigo ink on cool paper. */
:root{
  --paper:#F1F3F9; --panel:#FFFFFF; --ink:#1A2246; --ink2:#4B557D; --line:#D6DBEA;
  --accent:#2A3A8F; --accent-ink:#FFFFFF; --soft:#E4E8F7; --gold:#9A6B0C;
  --ok:#1D7A4B; --ok-bg:#E2F4EA; --bad:#B0352E; --bad-bg:#FBE7E5;
  --display:"Shippori Mincho B1","Shippori Mincho","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0D1230; --panel:#161D44; --ink:#E9ECFA; --ink2:#A4ACD3; --line:#2A3366;
  --accent:#93A3FF; --accent-ink:#0D1230; --soft:#1F2857; --gold:#E3B24C;
  --ok:#62D096; --ok-bg:#133B2B; --bad:#FF8F86; --bad-bg:#4A1E22; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0D1230; --panel:#161D44; --ink:#E9ECFA; --ink2:#A4ACD3; --line:#2A3366;
  --accent:#93A3FF; --accent-ink:#0D1230; --soft:#1F2857; --gold:#E3B24C;
  --ok:#62D096; --ok-bg:#133B2B; --bad:#FF8F86; --bad-bg:#4A1E22; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;
  padding-block:20px 104px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3,p{margin:0}
h2{font-family:var(--display);font-size:1.5rem;line-height:1.25;text-wrap:balance}
h3{font-size:1.02rem;line-height:1.35;text-wrap:balance}
.jp{font-family:var(--display)}
.eyebrow{font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);font-weight:700}
.muted{color:var(--ink2)}
.small{font-size:.88rem}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}


/* ---------- ZIP-inspired learning dashboard ---------- */
.feature-title{display:flex;align-items:end;justify-content:space-between;gap:10px}
.feature-title .muted{font-size:.78rem}
.feature-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.feature-card{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:6px;min-height:128px;padding:14px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(145deg,var(--panel),var(--soft));text-align:left;overflow:hidden}
.feature-card::after{content:"";position:absolute;width:70px;height:70px;border-radius:50%;right:-22px;bottom:-25px;background:var(--accent);opacity:.10}
.feature-card .fi{font-size:1.55rem;line-height:1}
.feature-card b{font-size:.96rem;line-height:1.25}
.feature-card span{font-size:.76rem;color:var(--ink2);line-height:1.35}
.feature-card.primary{background:linear-gradient(145deg,var(--accent),#5669d6);color:var(--accent-ink);border-color:var(--accent)}
.feature-card.primary span{color:inherit;opacity:.88}
.feature-card.primary::after{background:#fff;opacity:.12}
.feature-wide{grid-column:1/-1;min-height:104px;flex-direction:row;align-items:center}
.feature-wide .fi{font-size:1.9rem}
.roadmap{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
.roadmap .step{padding:9px 6px;text-align:center;border:1px solid var(--line);border-radius:11px;background:var(--panel);font-size:.72rem;font-weight:700}
.roadmap .step b{display:grid;place-items:center;width:24px;height:24px;margin:0 auto 5px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:.72rem}
.practice-list{display:flex;flex-direction:column;gap:8px}
.practice-row{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.practice-row .pi{font-size:1.25rem;width:30px;text-align:center}
.practice-row .pt{flex:1;min-width:0}
.practice-row .pt b{display:block;font-size:.9rem}
.practice-row .pt span{font-size:.75rem;color:var(--ink2)}
@media(max-width:390px){.feature-grid{grid-template-columns:1fr}.feature-wide{grid-column:auto}.roadmap{grid-template-columns:repeat(2,minmax(0,1fr))}}

.hero{display:flex;flex-direction:column;gap:6px;padding-top:6px}
.hero h1{font-family:var(--display);font-weight:700;font-size:clamp(64px,24vw,124px);line-height:1;color:var(--accent);letter-spacing:.02em}
.hero .lede{max-width:46ch;color:var(--ink2)}

.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;min-width:0}
.stat b{display:block;font-family:var(--display);font-size:1.7rem;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:.78rem;color:var(--ink2)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 18px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-weight:700}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.block{width:100%}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.bars{display:flex;flex-direction:column;gap:12px}
.bar-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;font-size:.9rem}
.bar-row .track{grid-column:1/-1;height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar-row .fill{height:100%;background:var(--accent);border-radius:99px}
.bar-row b{font-variant-numeric:tabular-nums}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.chip{flex:0 0 auto;min-height:38px;padding:6px 14px;border-radius:99px;border:1px solid var(--line);background:var(--panel);font-size:.92rem;font-weight:500}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}

.kgrid{display:grid;gap:8px}
.kgrid.c5{grid-template-columns:repeat(5,minmax(0,1fr))}
.kgrid.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kcell{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:68px;padding:6px 2px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}

/* ---------- EXAM LOCK MODE ---------- */

/* ===== Modern v2: logo, topbar, floating nav, cards ===== */
:root{--grad:linear-gradient(135deg,#4f63ff,#8b4dff);--shadow:0 8px 24px rgba(15,20,70,.10)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--shadow:0 8px 24px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--shadow:0 8px 24px rgba(0,0,0,.35)}
body{background:radial-gradient(900px 380px at 100% -80px,color-mix(in srgb,var(--accent) 16%,transparent),transparent 70%),var(--paper);padding-block:14px 120px}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ===== Ikon fitur: tile indigo + motif senada logo ===== */
.feature-card .fi,.quick-item .qi{background:linear-gradient(145deg,#1b2160,#4c46cc);color:#e3e5ff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14),0 6px 14px rgba(50,50,160,.32)}

.hero .brand .logo{width:54px;height:54px}
/* ===== Rapikan fitur belajar & akses cepat ===== */
.feature-title{align-items:center}
.feature-title .muted{display:none}
.feature-grid{gap:12px}
.feature-card{min-height:138px;padding:16px;gap:8px;align-items:flex-start;justify-content:flex-start;text-align:left}
.feature-card::after{display:none}
.feature-card b{font-size:.95rem;line-height:1.25;margin-top:4px}
.feature-card span:not(.fi){font-size:.76rem;line-height:1.4;color:var(--ink2)}
.feature-card.primary span:not(.fi){color:rgba(255,255,255,.9)}
.feature-card.feature-wide{min-height:0;flex-direction:row;align-items:center;gap:14px;grid-column:1/-1}
.feature-wide>div{display:flex;flex-direction:column;gap:2px;min-width:0}
.feature-wide .fi{flex:none}
.quick-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}

.quick-item div span{display:none}

/* ===== Fitur belajar: daftar baris yang tenang ===== */
.panel:has(.feature-grid),.panel:has(.quick-grid){background:none;border:0;box-shadow:none;padding:0;border-radius:0}
.feature-title{padding:0 4px}
.feature-title h3{font-size:1.1rem}

.feature-grid .feature-card::after{display:block;position:static;grid-area:c;width:auto;height:auto;background:none;opacity:1;border-radius:0;content:"\203A";font-size:1.6rem;line-height:1;color:var(--ink2)}

GRAM.push(
 {t:"Bentuk potensial · bisa melakukan",r:"Kelompok る: 〜られる (食べる → 食べられる, 見る → 見られる). Kelompok u: akhiran う-row diganti え-row + る (書く → 書ける, 飲む → 飲める, 話す → 話せる, 買う → 買える). する → できる, 来る → 来られる. Objek boleh memakai が: 日本語が 話せます.",
  ex:[["日本語が 話せます。","Saya bisa berbicara bahasa Jepang."],["納豆は 食べられません。","Saya tidak bisa makan natto."],["明日の 会議に 来られますか。","Apakah Anda bisa datang ke rapat besok?"],["漢字が 読めますか。","Apakah Anda bisa membaca kanji?"]]},
 {t:"Bentuk volisional · 〜よう / 〜おう",r:"Ajakan atau tekad (bentuk biasa dari 〜ましょう). Kelompok る: buang る + よう (食べる → 食べよう). Kelompok u: う-row diganti お-row + う (行く → 行こう, 飲む → 飲もう). する → しよう, 来る → 来よう. 〜ようと思う = berniat …. 〜ようとする = hendak / mencoba ….",
  ex:[["一緒に 帰ろう。","Ayo pulang bersama."],["来年 日本で 働こうと 思っています。","Saya berniat bekerja di Jepang tahun depan."],["出かけようと した とき、電話が 鳴りました。","Ketika hendak pergi, telepon berdering."]]},
 {t:"Kondisional · と, ば, たら, なら",r:"と: hasil otomatis atau kebiasaan (春に なると 花が 咲く). ば: syarat umum (bentuk ば: 安ければ, 行けば, 食べれば → 食べれば, する → すれば). たら: kalau / setelah …, paling luas dipakai. なら: kalau memang …, menanggapi informasi lawan bicara. Hasil dengan と tidak dipakai untuk ajakan atau permintaan.",
  ex:[["春に なると、花が 咲きます。","Kalau musim semi tiba, bunga mekar."],["安ければ、買います。","Kalau murah, saya beli."],["駅に 着いたら、連絡して ください。","Kalau sudah sampai di stasiun, tolong kabari."],["京都へ 行くなら、秋が いいですよ。","Kalau mau ke Kyoto, musim gugur bagus."]]},
 {t:"Memberi dan menerima",r:"あげる = memberi (dari saya ke orang lain). くれる = orang lain memberi kepada saya atau pihak saya. もらう = saya menerima dari orang lain. Dengan て, ketiganya berarti melakukan sesuatu sebagai bantuan: 〜てあげる, 〜てくれる, 〜てもらう. Bentuk sopan: さしあげる, くださる, いただく.",
  ex:[["友達に 本を 貸して あげました。","Saya meminjamkan buku kepada teman."],["先生が 日本語を 教えて くださいました。","Guru mengajarkan bahasa Jepang kepada saya."],["兄に 荷物を 運んで もらいました。","Saya dibantu kakak membawakan barang."],["母は 私に セーターを くれました。","Ibu memberi saya sweter."]]},
 {t:"〜ておく · 〜てある · 〜てみる · 〜てくる / ていく",r:"〜ておく = melakukan lebih dulu sebagai persiapan. 〜てある = keadaan hasil tindakan seseorang (kata kerja transitif + が). 〜てみる = mencoba …. 〜てくる = mulai berubah menuju sekarang. 〜ていく = terus berubah ke depan.",
  ex:[["会議の まえに 資料を 読んで おきます。","Sebelum rapat, saya baca dulu materinya."],["窓が 開けて あります。","Jendelanya sudah dibukakan."],["この ラーメンを 食べて みて ください。","Cobalah ramen ini."],["寒く なって きました。","Cuaca mulai dingin."]]},
 {t:"〜ところだ · tahap kejadian",r:"V-る + ところだ = hendak …. V-ている + ところだ = sedang …. V-た + ところだ = baru saja …. Berbeda dengan 〜たばかり yang lebih longgar soal waktu.",
  ex:[["今から 出かけるところです。","Saya hendak berangkat sekarang."],["いま 食事を している ところです。","Saya sedang makan."],["ちょうど 家に 着いた ところです。","Saya baru saja sampai di rumah."]]},
 {t:"Klausa penjelas kata benda",r:"Kalimat biasa (bentuk kamus) bisa langsung menerangkan kata benda. Subjek klausa memakai が atau の. Bentuk な-adj: 静かな 町. Bentuk lampau boleh dipakai di dalam klausa.",
  ex:[["これは 母が 作った ケーキです。","Ini kue yang dibuat ibu saya."],["昨日 会った 人は 田中さんです。","Orang yang saya temui kemarin adalah Tn. Tanaka."],["私が 住んでいる 町は 静かです。","Kota tempat saya tinggal itu tenang."]]},

function startQuiz(mode,arg){
  if(!isPrem()){
    if(mode==="type"&&(arg==="n3"||arg==="n2")){toast("Materi "+TYPES[arg].n+" hanya untuk Premium");return}
    if(mode==="sim"||(mode==="type"&&(arg==="c"||arg==="d"))){
      var fk=mode==="sim"?"sim":arg;
      if(!freeOK(fk)){toast(mode==="sim"?"Simulasi gratis minggu ini sudah dipakai. Premium: simulasi tanpa batas.":"Jatah gratis hari ini sudah dipakai. Besok ada lagi, atau pakai Premium untuk tanpa batas.");return}
      frGet()[fk]++;save()
    }
  }
  var ids=[],label="",r=Math.random;
  if(mode==="daily"){
    r=rng(Number(dkey().replace(/-/g,"")));label="Soal harian";
    var cnt={m:3,k:3,c:2,d:2};
    ["m","k","c","d"].forEach(function(t){ids=ids.concat(shuffle(idsOf(t),r).slice(0,cnt[t]))});
  }else if(mode==="type"){label="Latihan "+TYPES[arg].n;ids=shuffle(idsOf(arg),r).slice(0,isPrem()?10:5)}
  else if(mode==="sim"){label="Simulasi mini";["m","k","c","d"].forEach(function(t){ids=ids.concat(shuffle(idsOf(t),r).slice(0,5))})}
  else if(mode==="redo"){label="Ulang soal yang salah";ids=P.wrong.filter(function(i){return QB[i]}).slice(0,20)}
  if(!ids.length){toast("Belum ada soal untuk dikerjakan");return}
  S.Q={mode:mode,label:label,items:build(ids,r),i:0,picks:[],reveal:{},saved:false};
  syncExamLockUI();
  go("soal");
}

function vQuiz(){

  var L="ABCD";

  if(q.ctx)ctx='<div class="doc" lang="ja">'+esc(q.ctx)+'</div>';
  if(q.say){
    var shown=ans||Q.reveal[Q.i];
    var np=(Q.plays&&Q.plays[Q.i])||0,multi=q.say.indexOf("\n")>=0;

  }

  var fb="";
  if(ans){var good=it.opts[pick].ok;fb='<div class="fb '+(good?'ok':'bad')+'"><b class="'+(good?'o':'b')+'">'+(good?'Benar.':'Kurang tepat.')+'</b> '+(good?'':'Jawaban: '+esc(correct)+'. ')+esc(q.e)+'</div>'}
  var sp="";
  if(!q.say){var jt=jpText((q.ctx?q.ctx+"。":"")+q.q),ja=ans?jpText(correct):"";if(jt||ja)sp='<div class="row">'+(jt?'<button class="btn" data-act="qsay">🔊 Dengar soal</button>':'')+(ja?'<button class="btn" data-act="qsayans">🔊 Jawaban</button>':'')+'</div>'}

   '<div class="row">'+(ans?'<button class="btn primary" data-act="next" style="flex:1">'+(last?'Lihat hasil':'Soal berikutnya')+'</button>':'')+'</div>';
}
function finishQuiz(){
  var Q=S.Q;if(Q.saved)return;Q.saved=true;
  var c=0;
  Q.items.forEach(function(it,i){
    var ok=it.opts[Q.picks[i]]&&it.opts[Q.picks[i]].ok,t=it.q.t;
    var s=P.stats[t]||(P.stats[t]={c:0,t:0});s.t++;if(ok){s.c++;c++}
    var wi=P.wrong.indexOf(it.id);
    if(ok&&wi>=0)P.wrong.splice(wi,1);
    if(!ok&&wi<0)P.wrong.push(it.id);
  });
  Q.score=c;
  if(Q.mode==="daily"&&!P.days[dkey()])P.days[dkey()]={s:c,t:Q.items.length};
  save();
}
function vResult(){
  finishQuiz();
  var Q=S.Q,n=Q.items.length,pc=Math.round(Q.score*100/n);
  var by={};Q.items.forEach(function(it,i){var t=it.q.t;by[t]=by[t]||{c:0,t:0};by[t].t++;if(it.opts[Q.picks[i]].ok)by[t].c++});
  var rows=Object.keys(by).map(function(t){return '<tr><td>'+TYPES[t].n+'</td><td>'+by[t].c+' / '+by[t].t+'</td></tr>'}).join("");
  var wrong=Q.items.filter(function(it,i){return!it.opts[Q.picks[i]].ok});
  var rev=wrong.map(function(it){var c=it.opts.filter(function(o){return o.ok})[0].t;return '<div class="rev"><span class="tag">'+TYPES[it.q.t].n+'</span><p style="white-space:pre-line">'+esc(it.q.q)+'</p>'+(it.q.ctx?'<div class="doc" lang="ja">'+esc(it.q.ctx)+'</div>':'')+(it.q.say?'<div class="doc" lang="ja">'+esc(it.q.say)+'</div>':'')+'<p><b>Jawaban:</b> '+esc(c)+'</p><p class="muted small">'+esc(it.q.e)+'</p></div>'}).join("");
  var msg=pc>=80?"Hasil yang kuat. Lanjutkan dengan simulasi mini.":pc>=50?"Cukup baik. Ulangi materi dari soal yang salah.":"Masih awal. Baca ulang materi, lalu coba lagi.";
  return '<header><p class="eyebrow">'+esc(Q.label)+' selesai</p><div class="score">'+Q.score+'<span class="muted" style="font-size:1.6rem">/'+n+'</span></div><p class="muted">'+pc+'% benar. '+msg+'</p></header>'+

   '<div class="row"><button class="btn primary" data-act="menu" style="flex:1">Kembali ke menu soal</button>'+(wrong.length?'<button class="btn" data-act="redo" style="flex:1">Ulang yang salah</button>':'')+'</div>'+
   (wrong.length?'<section class="panel"><h3>Tinjau soal yang salah</h3>'+rev+'</section>':'');
}

}

function mkOpts(ok,pool){
  var seen={},d=[];seen[ok]=1;
  shuffle(pool,Math.random).forEach(function(x){if(d.length<3&&x&&!seen[x]){seen[x]=1;d.push(x)}});
  return shuffle([{t:ok,ok:true}].concat(d.map(function(x){return{t:x,ok:false}})),Math.random);
}
function sayOf(v){return v.rd&&v.jp.indexOf("〜")<0?v.rd.split(" / ")[0]:v.jp.replace(/〜/g,"")}
function mcItems(kind){
  var L;

    L=kanaList("hira").concat(kanaList("kata"));
    return shuffle(L,Math.random).slice(0,20).map(function(c){return{h:"Bagaimana cara membaca huruf ini?",big:c.k,say:c.k,opts:mkOpts(c.r,L.map(function(x){return x.r})),ans:c.r,e:c.k+" dibaca “"+c.r+"”."}});
  }
  if(kind==="listen"){
    L=VOC.filter(function(v){return v.jp.length<=8&&v.jp.indexOf("〜")<0&&v.jp.indexOf("…")<0});
    return shuffle(L,Math.random).slice(0,15).map(function(v){var s=sayOf(v);
      return{h:"Dengarkan, lalu pilih tulisan yang sesuai.",big:"🎧",say:s,opts:mkOpts(v.jp,L.filter(function(w){return sayOf(w)!==s}).map(function(w){return w.jp})),ans:v.jp,e:v.jp+(v.rd?" ("+v.rd+")":"")+" = "+v.id}});
  }
  if(kind==="rush"){
    L=VOC.filter(function(v){return v.jp.length<=10&&v.jp.indexOf("…")<0});
    return shuffle(L,Math.random).slice(0,100).map(function(v){return{h:"Apa artinya?",big:v.jp,sub:v.rd,opts:mkOpts(v.id,L.map(function(w){return w.id})),ans:v.id}});
  }
  if(kind==="kanji"){
    return shuffle(KANJI,Math.random).slice(0,20).map(function(k){return{h:"Apa arti kanji ini?",big:k[0],opts:mkOpts(k[2],KANJI.map(function(x){return x[2]})),ans:k[2],e:k[0]+" dibaca "+k[1]+", artinya "+k[2]+"."}});
  }
  if(kind==="verb"){
    var F=["ます","て","ない","た"];
    return shuffle(VERBS,Math.random).slice(0,15).map(function(v){
      var fi=3+Math.floor(Math.random()*4),cand=[3,4,5,6].filter(function(i){return i!==fi}).map(function(i){return v[i]}),extra=VERBS.map(function(w){return w[fi]});

    });

  return shuffle(PART,Math.random).slice(0,15).map(function(p){return{h:p[3],big:p[0],opts:mkOpts(p[1],p[2]),ans:p[1],e:p[4]}});
}
function sentPool(){
  var out=[],seen={};
  function add(j,t){
    var tk=String(j).replace(/\s+$/,"").split(/\s+/);
    if(tk.length<3||tk.length>7||seen[j]||j.slice(0,-1).search(/[。？]/)>=0)return;
    seen[j]=1;out.push({tk:tk,j:j,t:t});
  }
  GRAM.forEach(function(g){g.ex.forEach(function(e){add(e[0],e[1])})});
  [3,2].forEach(function(n){LV[n].g.forEach(function(g){g[2].forEach(function(e){add(e[0],e[1])})})});
  DLG.forEach(function(d){d.l.forEach(function(l){add(l[1],l[2])})});
  PHR.forEach(function(p){add(p[0],p[1])});
  return out;
}

  var G=S.G,it=G.items[G.i];if(!it)return;
  var idx=it.tk.map(function(_,k){return k}),p=idx;
  for(var t=0;t<8;t++){p=shuffle(idx,Math.random);if(p.join()!==idx.join())break}
  G.pool=p;G.sel=[];G.res=null;
}

    var G={mode:"mc",kind:m,title:meta[2],items:mcItems(m),i:0,score:0,pick:null,n:0,over:false,ol:(m==="listen"||m==="part"||m==="verb")?' lang="ja"':''};

    S.G=G;syncExamLockUI();return true;
  }
  if(m==="arr"){
    S.G={mode:"arr",kind:"arr",title:meta[2],items:shuffle(sentPool(),Math.random).slice(0,8),i:0,score:0,pool:[],sel:[],res:null};
    arrSetup();syncExamLockUI();return true;
  }
  if(m==="mem"){
    var s1={},s2={},pool=VOC.filter(function(v){
      if(v.jp.length>5||v.id.length>22||v.jp.indexOf("〜")>=0||v.jp.indexOf("…")>=0||s1[v.jp]||s2[v.id])return false;
      s1[v.jp]=1;s2[v.id]=1;return true;
    }),cards=[];
    shuffle(pool,Math.random).slice(0,6).forEach(function(v,k){cards.push({p:k,k:v.jp,s:"jp",say:sayOf(v)});cards.push({p:k,k:v.id,s:"id",say:sayOf(v)})});
    S.G={mode:"mem",kind:"mem",pairs:6,cards:shuffle(cards,Math.random),open:[],done:{},miss:0,moves:0,lock:false};
    syncExamLockUI();return true;

function mcPick(i){
  var G=S.G;if(!G||G.mode!=="mc"||G.over||G.pick!=null)return;
  var it=G.items[G.i],o=it.opts[i];if(!o)return;
  if(o.ok)G.score++;
  if(G.timed){G.n++;if(!o.ok)toast("Jawaban: "+it.ans);G.i++;if(G.i>=G.items.length)G.over=true;rerender(true);return}
  G.pick=i;rerender(true);
}
function mcNext(){
  var G=S.G;if(!G||G.mode!=="mc")return;
  G.i++;G.pick=null;rerender(false);window.scrollTo(0,0);
  if(G.kind==="listen"&&G.items[G.i])speak(G.items[G.i].say);
}
function arrAct(a,v){
  var G=S.G,it=G.items[G.i];if(!it&&a!=="garrnext")return;
  if(a==="garrpick"){if(G.res!==null)return;var p=G.pool.indexOf(v);if(p>=0){G.pool.splice(p,1);G.sel.push(v)}}
  else if(a==="garrun"){if(G.res!==null)return;var q=G.sel.indexOf(v);if(q>=0){G.sel.splice(q,1);G.pool.push(v)}}
  else if(a==="garrreset"){arrSetup()}
  else if(a==="garrcheck"){if(G.pool.length)return;var ok=G.sel.map(function(k){return it.tk[k]}).join(" ")===it.tk.join(" ");G.res=ok?"ok":"bad";if(ok)G.score++}
  else if(a==="garrnext"){G.i++;if(G.i<G.items.length)arrSetup();rerender(false);window.scrollTo(0,0);return}
  rerender(true);
}
function memTap(i){
  var G=S.G;if(!G||G.mode!=="mem"||G.lock)return;
  var c=G.cards[i];if(!c||G.done[c.p]||G.open.indexOf(i)>=0)return;
  G.open.push(i);
  if(G.open.length===2){
    var a=G.cards[G.open[0]],b=G.cards[G.open[1]];G.moves++;
    if(a.p===b.p){G.done[a.p]=1;G.open=[];speak(a.say)}
    else{G.miss++;G.lock=true;rerender(true);setTimeout(function(){if(S.G===G){G.open=[];G.lock=false;rerender(true)}},800);return}
  }
  rerender(true);
}

function initCanvas(){
  var cv=$("#cv");if(!cv)return;var ctx=cv.getContext("2d"),down=false;
  ctx.lineWidth=10;ctx.lineCap="round";ctx.lineJoin="round";ctx.strokeStyle=getComputedStyle(document.body).color;
  function pt(e){var b=cv.getBoundingClientRect();return[(e.clientX-b.left)*cv.width/b.width,(e.clientY-b.top)*cv.height/b.height]}
  cv.addEventListener("pointerdown",function(e){down=true;cv.setPointerCapture(e.pointerId);var p=pt(e);ctx.beginPath();ctx.moveTo(p[0],p[1]);ctx.lineTo(p[0]+.1,p[1]);ctx.stroke();e.preventDefault()});
  cv.addEventListener("pointermove",function(e){if(!down)return;var p=pt(e);ctx.lineTo(p[0],p[1]);ctx.stroke();e.preventDefault()});
  ["pointerup","pointercancel"].forEach(function(n){cv.addEventListener(n,function(){down=false})});
}

function examLocked(){
  return !!((S.Q&&S.Q.i<S.Q.items.length)||(S.G&&!(S.G.fin||S.G.over||((S.G.mode==="arr"||S.G.mode==="mem")&&S.G.i>=S.G.items.length))));

function syncExamLockUI(){

}
function examExit(ask){
  if(!examLocked()){S.Q=null;S.G=null;syncExamLockUI();return true}
  if(ask&&!window.confirm("Keluar dari sesi ini? Progres jawaban yang belum selesai tidak akan dicatat sebagai hasil akhir."))return false;
  audStop();gStop();S.Q=null;S.G=null;S.sopen=false;syncExamLockUI();
  if((location.hash||"")==="#soal")render();else go("soal");
  return true;
}
function lockedRoute(){
  if(!examLocked())return false;
  var h=(location.hash||"").slice(1);

    history.replaceState(null,document.title,"#soal");

}
function cur(){var h=(location.hash||"").slice(1);return VIEWS[h]?h:"beranda"}

$("#app").addEventListener("click",function(e){
  var b=e.target.closest("[data-act]");if(!b||b.disabled)return;
  var a=b.getAttribute("data-act"),v=b.getAttribute("data-v"),Q=S.Q;
  switch(a){
    case"g":startGame(v);rerender(false);window.scrollTo(0,0);if(S.G&&S.G.kind==="listen"&&S.G.items[0])speak(S.G.items[0].say);break;
    case"gquit":examExit(true);break;
    case"gpick":mcPick(Number(v));break;
    case"gmnext":mcNext();break;
    case"gmem":memTap(Number(v));break;
    case"garrpick":case"garrun":case"garrreset":case"garrcheck":case"garrnext":arrAct(a,Number(v));break;
    case"gset":S.G.set=v;startGame("write");rerender(false);break;
    case"gnext":S.G.i++;if(S.G.i>=S.G.list.length){S.G.list=shuffle(S.G.list,Math.random);S.G.i=0}rerender(false);break;
    case"gclear":var gcv=$("#cv");if(gcv)gcv.getContext("2d").clearRect(0,0,gcv.width,gcv.height);break;
    case"gguide":var ggl=$("#gl");if(ggl)ggl.style.visibility=ggl.style.visibility==="visible"?"hidden":"visible";break;
    case"gl":S.G.sel=Number(v);speak(S.G.L[S.G.sel].s||S.G.L[S.G.sel].t);rerender(true);break;
    case"gr":var gA=S.G;if(gA.sel==null){toast("Pilih sisi kiri dulu");break}var gB=gA.R[Number(v)];if(gA.L[gA.sel].k===gB.k){gA.done[gB.k]=1}else{gA.miss++;toast("Belum cocok")}gA.sel=null;rerender(true);break;
    case"pkgpick":S.pick=Number(v);rerender(false);break;
    case"pkgback":S.pick=null;rerender(false);break;
    case"vtest":speak("こんにちは。日本語を べんきょうしましょう。");break;
    case"signup":signup();break;
    case"logout":location.href="index.html?keluar=1";break;
    case"askq":ask(v);break;
    case"ask":ask(($("#sq")||{}).value);break;
    case"buy":S.pay=v;rerender(false);break;
    case"paycancel":S.pay=null;rerender(false);break;
    case"paid":var dd=new Date();dd.setDate(dd.getDate()+PLANS[S.pay].d);P.plan="premium";P.until=dkey(dd);S.pay=null;save();toast("Premium aktif (simulasi)");rerender(false);break;
    case"downgrade":P.plan="free";P.until="";save();rerender(false);break;
    case"say":speak(b.getAttribute("data-t"));break;
    case"kana":S.kana=v;rerender(true);break;
    case"vt":S.vt=v;rerender(true);break;
    case"mat":S.mat=v;rerender(false);break;
    case"ct":S.ct=v;S.deck=deckFor(v);S.flip=false;rerender(false);break;
    case"flip":S.flip=!S.flip;rerender(true);break;
    case"got":P.known[VOC[S.deck[0]].jp]=1;save();S.deck.shift();S.flip=false;rerender(true);break;
    case"again":S.deck.push(S.deck.shift());S.flip=false;rerender(true);break;
    case"creset":VOC.forEach(function(w){if(S.ct==="all"||w.th===S.ct)delete P.known[w.jp]});save();S.deck=deckFor(S.ct);S.flip=false;rerender(false);break;
    case"daily":startQuiz("daily");break;
    case"profile":go("profile");break;
    case"profileSave":
      var nm=($("#profileName")||{value:""}).value.trim();
      if(!nm){toast("Nama belum diisi");break}
      var account=getActiveAccount();
      if(!account){toast("Akun belum aktif. Masuk ulang.");break}
      account.n=nm;saveActiveAccount(account);P.acct=account;
      var fi=$("#profilePhoto"),file=fi&&fi.files&&fi.files[0];
      if(!file){save();toast("Profil berhasil disimpan");go("akun");break}

      var rd=new FileReader();

        var im=new Image();

          var max=512,w=im.width,h=im.height;

        };
        im.src=rd.result;
      };
      rd.readAsDataURL(file);
      break;
    case"homefeat":
      if(v==="jft"){go("ujian");}
      else if(v==="sensei"){go("sensei");}
      else {S.mat=v;go("materi");}
      break;

    case"sim":startQuiz("sim");break;
    case"redo":startQuiz("redo");break;
    case"qtype":startQuiz("type",v);break;
    case"pick":audStop();Q.picks[Q.i]=Number(v);rerender(true);break;
    case"next":audStop();Q.i++;rerender(false);window.scrollTo(0,0);break;
    case"qsay":speak(jpText((Q.items[Q.i].q.ctx?Q.items[Q.i].q.ctx+"。":"")+Q.items[Q.i].q.q));break;
    case"qsayans":speak(jpText(Q.items[Q.i].opts.filter(function(o){return o.ok})[0].t));break;
    case"play":case"playslow":Q.plays=Q.plays||{};Q.plays[Q.i]=(Q.plays[Q.i]||0)+1;speakScript(Q.items[Q.i].q.say,a==="playslow"||S.slow);{var pe=$("#plays");if(pe)pe.textContent="Diputar "+Q.plays[Q.i]+"×"}break;
    case"stopaud":audStop();break;
    case"test":speak("こんにちは。にほんごの おんせいの テストです。");break;
    case"slow":S.slow=!S.slow;rerender(true);break;
    case"reveal":Q.reveal[Q.i]=true;rerender(true);break;
    case"quit":examExit(true);break;
    case"menu":audStop();S.Q=null;rerender(false);window.scrollTo(0,0);break;
    case"wipe":if(b.getAttribute("data-sure")){P=blank();save();S.deckInit=false;toast("Progres dihapus");render()}else{b.setAttribute("data-sure","1");b.textContent="Ketuk lagi untuk menghapus";}break;
  }
});
