<!doctype html><html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JFT Basic Nihongo</title>
<body style="font:16px system-ui;max-width:420px;margin:12vh auto;padding:16px;text-align:center">
<h1>日本語 JFT Basic</h1><p id="s">Masuk untuk mulai belajar.</p>
<button id="in" style="padding:12px 20px;font-size:16px">Masuk dengan Google</button>
<button id="out" hidden style="padding:12px 20px;font-size:16px">Keluar</button>
<p><a id="go" href="app.html" hidden>Buka aplikasi belajar →</a></p>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {firebaseConfig} from "./firebase-config.js";
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const $=id=>document.getElementById(id);
$("in").onclick=()=>signInWithPopup(auth,new GoogleAuthProvider()).catch(e=>$("s").textContent="Gagal masuk: "+e.code);
$("out").onclick=()=>signOut(auth);
onAuthStateChanged(auth,async u=>{
  $("in").hidden=!!u;$("out").hidden=!u;$("go").hidden=!u;
  if(!u){$("s").textContent="Masuk untuk mulai belajar.";return}
  const ref=doc(db,"users",u.uid);
  if(!(await getDoc(ref)).exists())await setDoc(ref,{name:u.displayName||"",email:u.email||"",plan:"free",createdAt:serverTimestamp()});
  $("s").textContent="Halo, "+(u.displayName||u.email);
});
</script></body></html>
