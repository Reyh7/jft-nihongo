<!doctype html><html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin</title><body style="font:15px system-ui;max-width:720px;margin:24px auto;padding:16px">
<h1>Daftar pengguna</h1><button id="in">Masuk Google (admin)</button><p id="s"></p>
<table id="t" border="1" cellpadding="6" style="border-collapse:collapse"></table>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,getDocs,query,orderBy} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {firebaseConfig} from "./firebase-config.js";
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
document.getElementById("in").onclick=async()=>{
  try{await signInWithPopup(auth,new GoogleAuthProvider());
    const sn=await getDocs(query(collection(db,"users"),orderBy("createdAt","desc")));
    document.getElementById("s").textContent=sn.size+" pengguna";
    const t=document.getElementById("t");t.textContent="";
    sn.forEach(d=>{const x=d.data(),r=t.insertRow();[x.name,x.email,x.plan,x.createdAt?.toDate().toLocaleString("id-ID")||""].forEach(v=>r.insertCell().textContent=v)});
  }catch(e){document.getElementById("s").textContent="Ditolak atau gagal: "+e.code}
};
</script></body></html>
