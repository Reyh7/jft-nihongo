<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin · JFT Basic Nihongo</title>
<style>
:root{--p:#F1F3F9;--c:#fff;--i:#1A2246;--i2:#4B557D;--l:#D6DBEA;--a:#2A3A8F;--ac:#fff;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--p:#0D1230;--c:#161D44;--i:#E9ECFA;--i2:#A4ACD3;--l:#2A3366;--a:#93A3FF;--ac:#0D1230;color-scheme:dark}}
body{margin:0 auto;background:var(--p);color:var(--i);font:15px/1.5 system-ui,sans-serif;padding:16px;max-width:720px}
button,input{font:inherit;padding:9px 12px;border-radius:8px;border:1px solid var(--l);background:var(--c);color:var(--i)}
button{cursor:pointer}button.p{background:var(--a);color:var(--ac);border-color:var(--a)}
input{width:100%;box-sizing:border-box;margin:10px 0}
.u{background:var(--c);border:1px solid var(--l);border-radius:12px;padding:12px;margin:10px 0;display:grid;gap:8px}
.r{display:flex;flex-wrap:wrap;gap:6px}.m{color:var(--i2);font-size:.85rem}
</style>
</head>
<body>
<h1>Admin Premium</h1>
<button class="p" id="in">Masuk Google (admin)</button> <span id="s" class="m" role="status"></span>
<input id="q" placeholder="Cari nama atau email" aria-label="Cari pengguna">
<div id="list"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,getDocs,query,orderBy,doc,updateDoc} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {firebaseConfig} from "./firebase-config.js";
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const $=id=>document.getElementById(id);
let users=[];
const pad=n=>String(n).padStart(2,"0");
const fmt=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today=()=>fmt(new Date());
function render(){
  const q=$("q").value.toLowerCase();$("list").textContent="";
  users.filter(u=>((u.name||"")+" "+(u.email||"")).toLowerCase().includes(q)).forEach(u=>{
    const d=document.createElement("div");d.className="u";
    const prem=u.plan==="premium"&&(u.until||"")>=today();
    const t=document.createElement("div");t.innerHTML="<b></b><div class='m'></div>";
    t.firstChild.textContent=u.name||"(tanpa nama)";
    t.lastChild.textContent=(u.email||"")+" · "+(prem?"Premium sampai "+u.until:"FREE");
    d.append(t);
    const r=document.createElement("div");r.className="r";
    [[1,30],[3,90],[6,180],[12,365]].forEach(([m,days])=>{
      const b=document.createElement("button");b.className="p";b.textContent="+"+m+" bln";b.onclick=()=>act(u,days,m);r.append(b)});
    const x=document.createElement("button");x.textContent="Cabut";x.onclick=()=>act(u,0,0);r.append(x);
    d.append(r);$("list").append(d)});
}
async function act(u,days,m){
  if(days===0){if(confirm("Cabut Premium "+u.email+"?"))await save(u,"free","");return}
  const base=(u.plan==="premium"&&(u.until||"")>=today())?new Date(u.until+"T00:00:00"):new Date();
  base.setDate(base.getDate()+days);const until=fmt(base);
  if(confirm("Aktifkan Premium "+m+" bulan untuk "+u.email+" sampai "+until+"?"))await save(u,"premium",until);
}
async function save(u,plan,until){
  try{await updateDoc(doc(db,"users",u.id),{plan,until});u.plan=plan;u.until=until;render();$("s").textContent="Tersimpan."}
  catch(e){$("s").textContent="Gagal: "+e.code}
}
async function load(){
  const sn=await getDocs(query(collection(db,"users"),orderBy("createdAt","desc")));
  users=sn.docs.map(d=>({id:d.id,...d.data()}));$("s").textContent=users.length+" pengguna";render();
}
$("in").onclick=async()=>{try{await signInWithPopup(auth,new GoogleAuthProvider());await load()}catch(e){$("s").textContent="Ditolak atau gagal: "+e.code}};
$("q").oninput=render;
</script>
</body>
</html>
